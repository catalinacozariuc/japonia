<!DOCTYPE html>
<html lang="ro">
<meta charset="utf-8">
<title>日課 · Programul zilelor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --hartie:#F5EFE4; --hartie2:#FFFCF6; --tus:#33302B; --gri:#8A8377;
  --artar:#C4452D; --kaki:#B07C2A; --ceai:#6E7A52; --indigo:#4A6274; --prun:#4A4459;
  --linie:#E2D8C6; --linie2:#EFE7D9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--hartie);color:var(--tus);
  font-family:"Helvetica Neue",Inter,system-ui,sans-serif;
  padding:26px 18px 90px;
  background-image:radial-gradient(circle at 90% 0%,rgba(196,69,45,.07),transparent 45%),
    radial-gradient(circle at 5% 12%,rgba(110,122,82,.07),transparent 40%),
    radial-gradient(circle at 40% 100%,rgba(176,124,42,.05),transparent 50%);
  background-attachment:fixed}
.wrap{max-width:920px;margin:0 auto}

a.inapoi{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gri);text-decoration:none;margin-bottom:18px}
a.inapoi:hover{color:var(--artar)}

.kanji{font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;font-size:clamp(28px,6vw,42px);
  color:var(--artar);letter-spacing:.08em;margin:0;line-height:1.1}
h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(15px,2.4vw,19px);letter-spacing:.2em;
  text-transform:uppercase;margin:10px 0 0}

/* ---------- etapele călătoriei ---------- */
.etape{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:26px 0 0}
.etapa{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;color:var(--tus);
  background:var(--hartie2);border:1.5px solid var(--linie);border-left:5px solid var(--ac);
  border-radius:4px;padding:13px 15px;cursor:pointer;
  transition:background .18s,border-color .18s,transform .16s,box-shadow .18s,color .18s}
.etapa:hover{background:var(--ac);border-color:var(--ac);transform:translateX(3px);
  box-shadow:0 10px 22px rgba(80,60,40,.15)}
.etapa:hover .e-jp,.etapa:hover .e-n,.etapa:hover .e-m{color:#fff}
.etapa:focus-visible{outline:2px solid var(--kaki);outline-offset:3px}
.etapa.on{background:var(--ac);border-color:var(--ac)}
.etapa.on .e-jp,.etapa.on .e-n,.etapa.on .e-m{color:#fff}
.etapa .e-jp{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:26px;line-height:1;color:var(--ac)}
.etapa .e-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.etapa .e-n{font-family:Georgia,serif;font-size:19px;line-height:1.15}
.etapa .e-m{font-size:11px;letter-spacing:.05em;color:var(--kaki)}
@media(max-width:860px){.etape{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.etape{grid-template-columns:1fr}}

/* ---------- zilele ---------- */
.zilenav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 0;position:sticky;top:0;z-index:20;
  background:var(--hartie);padding:12px 0;border-bottom:1px solid var(--linie)}
.zilenav button{font:inherit;font-size:12.5px;cursor:pointer;background:var(--hartie2);color:var(--tus);
  border:1px solid var(--linie);border-radius:2px;padding:8px 13px;
  transition:background .15s,border-color .15s,color .15s}
.zilenav button:hover{border-color:var(--artar)}
.zilenav button:focus-visible{outline:2px solid var(--kaki);outline-offset:2px}
.zilenav button.on{background:var(--tus);color:var(--hartie);border-color:var(--tus)}
.zilenav .zi-jp{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;margin-right:6px;opacity:.75}
.zilenav .sep{width:1px;background:var(--linie);margin:2px 4px}

.zi-cap{border-bottom:1px solid var(--linie);padding:26px 0 12px;margin-bottom:22px}
.zi-cap h2{font-family:Georgia,serif;font-weight:400;font-size:clamp(22px,4vw,29px);margin:0;color:var(--artar)}
.zi-cap .zi-zi{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gri);margin-bottom:6px}

/* ---------- banda ---------- */
.banda{display:grid;grid-template-columns:118px 1fr;gap:20px;padding:0 0 24px}
.banda .rail{position:relative;padding-top:2px}
.banda .rail .j{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:25px;color:var(--ac);line-height:1}
.banda .rail b{display:block;font-family:Georgia,serif;font-weight:400;font-size:16px;margin:6px 0 3px}
.banda .rail span{display:block;font-size:11px;color:var(--gri)}
.banda .rail::after{content:"";position:absolute;right:-10px;top:4px;bottom:-24px;width:2px;background:var(--linie)}
.banda:last-of-type .rail::after{bottom:8px}
.banda .continut{min-width:0;display:flex;flex-direction:column;gap:10px}
@media(max-width:620px){
  .banda{grid-template-columns:1fr;gap:10px;padding-bottom:20px}
  .banda .rail{display:flex;align-items:baseline;gap:9px;border-left:3px solid var(--ac);padding:1px 0 1px 11px}
  .banda .rail::after{display:none}
  .banda .rail .j{font-size:17px}
  .banda .rail b{margin:0}
  .banda .rail span{margin-left:auto}
}

/* ---------- fișe ---------- */
.fisa{background:var(--hartie2);border:1px solid var(--linie);border-left:4px solid var(--ac);
  border-radius:3px;padding:13px 16px;position:relative}
.fisa .ora{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--kaki)}
.fisa h3{margin:4px 0 0;font-family:Georgia,serif;font-weight:400;font-size:17.5px;line-height:1.3}
.fisa p{margin:6px 0 0;font-size:13.5px;line-height:1.55;color:#4A453C}
.fisa .drum{margin-top:7px;font-size:11.5px;color:var(--gri)}
.fisa .drum::before{content:"↳ ";opacity:.6}

/* ---------- butonul mic de detalii ----------
   Închis din start: sub titlu rămâne doar un rând discret, iar descrierea,
   drumul și biletele apar numai dacă cineva chiar le vrea. */
.mai{margin-top:9px}
.mai summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;list-style:none;
  font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--gri);
  border:1px solid var(--linie);border-radius:99px;padding:3px 10px;background:rgba(255,255,255,.5);
  transition:color .15s,border-color .15s,background .15s}
.mai summary::-webkit-details-marker{display:none}
.mai summary:hover{color:var(--artar);border-color:rgba(196,69,45,.4);background:rgba(255,255,255,.85)}
.mai summary:focus-visible{outline:2px solid var(--kaki);outline-offset:2px}
.mai .sg{font-size:9px;line-height:1;transition:transform .18s}
.mai[open] summary .sg{transform:rotate(90deg)}
.mai[open] summary{color:var(--artar);border-color:rgba(196,69,45,.35)}
.mai .mai-corp{margin-top:2px}
.mai .mai-corp p{margin:8px 0 0;font-size:13.5px;line-height:1.55;color:#4A453C}
@media print{.mai .mai-corp{display:block!important}.mai summary{display:none}}

/* legăturile spre cartonașele de experiențe */
.fisa .leg{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
.fisa .leg a{display:inline-block;font-size:11.5px;line-height:1.15;color:var(--artar);
  text-decoration:none;background:rgba(255,255,255,.6);
  border:1px solid rgba(196,69,45,.3);border-radius:99px;padding:5px 11px;
  transition:background .15s,border-color .15s,color .15s}
.fisa .leg a:hover{background:var(--artar);border-color:var(--artar);color:#fff}
.fisa .leg a:focus-visible{outline:2px solid var(--kaki);outline-offset:2px}
.sigiliu{position:absolute;top:11px;right:13px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
  font-size:13px;color:var(--artar);border:1.5px solid var(--artar);border-radius:3px;
  width:25px;height:25px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.7)}
.fisa.cu-sigiliu h3{padding-right:32px}

.fisa.deschis{background:transparent;border-style:dashed;border-left-style:solid;border-left-color:var(--linie)}
.fisa.deschis h3,.fisa.deschis .ora{color:var(--gri)}

/* mesele — chenar roșu, ca în document */
.fisa.masa{border-color:rgba(196,69,45,.3);border-left-color:var(--artar);
  background:rgba(196,69,45,.045)}
.fisa.masa .ora{color:var(--artar)}

.cazare{font-size:12.5px;line-height:1.6;color:var(--gri);margin:16px 0 0;
  border-left:2px solid var(--linie);padding-left:12px;max-width:70ch}
.cazare b{color:var(--tus);font-weight:600}

.nota{border-left:3px solid var(--kaki);background:rgba(176,124,42,.07);border-radius:2px;
  padding:10px 13px;font-size:12.5px;line-height:1.55;color:#5C5346}
.nota b{color:var(--tus);font-weight:600}

/* ---------- placeholder etapă ---------- */
.gol{border:1px dashed var(--linie);border-radius:4px;background:var(--hartie2);
  padding:36px 26px;text-align:center;margin-top:26px}
.gol .g-jp{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:34px;color:var(--ac);opacity:.55}
.gol h2{font-family:Georgia,serif;font-weight:400;font-size:22px;margin:12px 0 8px;color:var(--tus)}
.gol p{font-size:13.5px;line-height:1.65;color:var(--gri);margin:0 auto;max-width:44ch}
.gol .zile-goale{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.gol .zg{border:1px solid var(--linie);border-radius:2px;padding:7px 14px;font-size:12px;color:var(--gri);
  background:var(--hartie)}

/* ---------- săgeata spre ziua anterioară / următoare ---------- */
.nav-zi{position:fixed;bottom:16px;z-index:30;display:flex;align-items:center;gap:9px;
  font:inherit;cursor:pointer;text-align:left;color:var(--tus);
  background:rgba(255,252,246,.94);border:1px solid var(--linie);border-radius:3px;
  padding:9px 13px;box-shadow:0 6px 18px rgba(80,60,40,.13);
  transition:border-color .16s,color .16s,transform .16s,box-shadow .16s}
.nav-zi.prev{left:16px}
.nav-zi.next{right:16px}
.nav-zi[hidden]{display:none}
.nav-zi:hover{border-color:var(--artar);color:var(--artar);box-shadow:0 10px 24px rgba(80,60,40,.2)}
.nav-zi.prev:hover{transform:translateX(-2px)}
.nav-zi.next:hover{transform:translateX(2px)}
.nav-zi:focus-visible{outline:2px solid var(--kaki);outline-offset:3px}
.nav-zi .sag{font-size:15px;line-height:1;color:var(--artar)}
.nav-zi .et{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gri);margin-bottom:2px}
.nav-zi b{display:block;font-family:Georgia,serif;font-weight:400;font-size:14px;line-height:1.1}
@media(max-width:560px){
  .nav-zi{bottom:12px;padding:8px 11px}
  .nav-zi.prev{left:10px} .nav-zi.next{right:10px}
  .nav-zi .et{display:none}
}
@media print{.nav-zi{display:none}}

/* ---------- comentarii per oraș ---------- */
.comente{margin-top:38px;border-top:1px solid var(--linie);padding-top:22px}
.comente h2{font-family:Georgia,serif;font-weight:400;font-size:21px;margin:0 0 6px;color:var(--artar)}
.comente .intro{font-size:13px;line-height:1.6;color:var(--gri);margin:0 0 16px;max-width:62ch}
.cmt-fir{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.cmt{border:1px solid var(--linie);border-left:3px solid var(--linie);border-radius:3px;
  padding:10px 13px;background:var(--hartie2)}
.cmt.al-meu{border-left-color:var(--artar);background:rgba(196,69,45,.03)}
.cmt-cap{display:flex;align-items:baseline;gap:9px;margin-bottom:3px}
.cmt-nume{font-family:Georgia,serif;font-size:14px;color:var(--tus)}
.cmt-data{font-size:11px;color:var(--gri)}
.cmt-text{font-size:13.5px;line-height:1.55;color:var(--tus);white-space:pre-wrap}
.cmt-act{margin-top:6px;display:flex;gap:12px}
.cmt-gol{font-size:13px;color:var(--gri);font-style:italic;margin:0 0 16px}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-size:12px;color:var(--kaki);
  cursor:pointer;text-decoration:underline}
.linkbtn.del{color:var(--artar)}
.linkbtn:hover{opacity:.75}
.cmt-nou textarea,.cmt-edit{width:100%;border:1px solid var(--linie);border-radius:3px;
  padding:9px 11px;font-family:inherit;font-size:13.5px;color:var(--tus);
  background:var(--hartie2);resize:vertical;line-height:1.5}
.cmt-nou textarea:focus,.cmt-edit:focus{outline:none;border-color:var(--artar)}
.cmt-rand{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:9px}
.btn{font:inherit;font-size:13px;cursor:pointer;background:var(--hartie2);color:var(--tus);
  border:1px solid var(--linie);border-radius:2px;padding:8px 15px;
  transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--artar)}
.btn.primary{background:var(--artar);border-color:var(--artar);color:#fff}
.btn.primary:hover{background:#a83722}
.btn.sm{padding:5px 12px;font-size:12px}
.btn:focus-visible{outline:2px solid var(--kaki);outline-offset:2px}
.cmt-eu{font-size:11.5px;color:var(--gri)}

/* ---------- cartonașul deschis peste program ---------- */
.cart-fund{position:fixed;inset:0;background:rgba(58,38,22,.44);z-index:75;
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:cartIn .18s ease}
@keyframes cartIn{from{opacity:0}to{opacity:1}}
.cart{background:var(--hartie2);border:1px solid var(--linie);border-radius:4px;
  width:100%;max-width:440px;max-height:88vh;overflow:auto;position:relative;
  box-shadow:0 24px 60px rgba(58,38,22,.32);animation:cartSus .22s ease}
@keyframes cartSus{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.cart .poza{aspect-ratio:16/10;background-size:cover;background-position:center;
  background-color:var(--linie2);border-bottom:1px solid var(--linie);
  filter:saturate(.82) contrast(1.05) sepia(.14)}
.cart .poza.gol{display:flex;align-items:center;justify-content:center;font-size:44px;filter:none}
.cart .corp{padding:16px 18px 18px}
.cart .kicker{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--kaki);
  display:flex;align-items:center;gap:7px}
.cart .kicker .dot{width:6px;height:6px;border-radius:50%;background:var(--artar);flex:none}
.cart h3{margin:7px 0 0;font-family:Georgia,serif;font-weight:400;font-size:20px;line-height:1.25;color:var(--tus)}
.cart .desc{margin:9px 0 0;font-size:13.5px;line-height:1.6;color:#4A453C}
.cart .why{margin:12px 0 0;font-size:13px;line-height:1.55;color:#5C5346;
  border-left:2px solid rgba(176,124,42,.45);padding-left:12px}
.cart .why b{display:block;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--kaki);margin-bottom:4px;font-weight:600}
.cart .subsol{margin-top:16px;padding-top:13px;border-top:1px solid var(--linie);
  display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.cart .subsol a{font-size:12px;color:var(--artar);text-decoration:none;
  border-bottom:1px solid rgba(196,69,45,.35)}
.cart .subsol a:hover{border-bottom-color:var(--artar)}
/* z-index: poza are un filtru, iar filtrul îi face context de stivuire, așa că
   altfel se așază peste butonul de închidere și îi fură clicul. */
.cart-x{position:absolute;top:9px;right:9px;width:30px;height:30px;border-radius:50%;z-index:2;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:rgba(255,252,246,.9);border:1px solid var(--linie);color:var(--tus);
  font:inherit;font-size:17px;line-height:1;padding:0}
.cart-x:hover{background:var(--artar);border-color:var(--artar);color:#fff}
.cart-x:focus-visible,.cart .subsol a:focus-visible{outline:2px solid var(--kaki);outline-offset:2px}
.cart .astept{padding:26px 18px;text-align:center;font-size:13px;color:var(--gri)}

/* cererea prenumelui */
.modal-fund{position:fixed;inset:0;background:rgba(58,38,22,.42);display:flex;
  align-items:center;justify-content:center;padding:20px;z-index:70}
.modal{background:var(--hartie);border:1px solid var(--linie);border-radius:4px;
  padding:24px;max-width:380px;width:100%;box-shadow:0 24px 60px rgba(58,38,22,.3)}
.modal h3{font-family:Georgia,serif;font-weight:400;font-size:20px;margin:0 0 8px;color:var(--tus)}
.modal p{font-size:13px;line-height:1.6;color:var(--gri);margin:0 0 14px}
.modal input{width:100%;border:1px solid var(--linie);border-radius:3px;padding:9px 11px;
  font-family:inherit;font-size:14px;color:var(--tus);background:var(--hartie2)}
.modal input:focus{outline:none;border-color:var(--artar)}

#status{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(100%);
  background:var(--tus);color:var(--hartie);font-size:12px;padding:9px 16px;
  border-radius:3px 3px 0 0;z-index:80;transition:transform .25s;max-width:92vw;text-align:center}
#status.on{transform:translateX(-50%) translateY(0)}

/* ---------- de rezervat ---------- */
.check{margin-top:34px;border-top:1px solid var(--linie);padding-top:22px}
.check h2{font-family:Georgia,serif;font-weight:400;font-size:21px;margin:0 0 14px;color:var(--artar)}
.check-grup{margin-bottom:20px}
.check-grup:last-child{margin-bottom:0}
.check-grup .cg-nume{font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gri);margin:0 0 10px}
.check ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.check li{position:relative;padding-left:25px;font-size:13.5px;line-height:1.55;color:#4A453C}
.check li::before{content:"□";position:absolute;left:0;top:-1px;font-size:15px;color:var(--kaki)}
.check li b{color:var(--tus)}
.check-grup.dec li::before{content:"○";color:var(--ceai)}
.check.practic li::before{content:"•";color:var(--gri)}
footer{margin-top:30px;padding-top:15px;border-top:1px solid var(--linie);
  font-size:11.5px;color:var(--gri);line-height:1.7}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{body{background:#fff;padding:0}.zilenav,.etape,a.inapoi{display:none}
  .zi{display:block!important;page-break-after:always}}
</style>

</div>

];

];

  hakone:"Cazare: 3 – 5 noiembrie la <b>Hakone Ashinoko Hanaori</b>, la Togendai, pe malul de nord al lacului Ashi. Mergem doar cu bagaje mici; valizele mari pleacă din Tokyo direct la Kyoto.",
  kyoto:"Cazare: 5 – 12 noiembrie la <b>Onyado Nono Kyoto Shichijo</b>, cu izvoare termale naturale, la câteva minute pe jos de Gara Kyoto.",
  tokyo2:"Cazare: 12 – 14 noiembrie la <b>Royal Park Hotel Iconic Tokyo Shiodome</b> — un minut de stația Shiodome, trei de Shimbashi printr-un pasaj subteran."
};

const ZILE = {

/* ==================== TOKYO · 31 octombrie – 3 noiembrie ==================== */
tokyo:[
{
  id:"o31", jp:"零", scurt:"31 oct", zi:"Sâmbătă · sosire", titlu:"31 octombrie",

/* ================== comentarii per oraș ==================
   Folosim aceeași foaie Google și aceeași formă de date ca index.html, ca să
   nu avem două surse de adevăr. Comentariile de aici stau sub cheia
   coment["program:<oraș>"], deci nu se amestecă cu cele despre experiențe. */
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbza_AKsZh8KuIF5DYiwB9jdQfaA_4Et7o1gs-32oMwc0jKhYxEGOVe5zxyazxE4DmQBSg/exec";

const esc = t => (t||"").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const cheieNume = n => (n||"").trim().toLowerCase();
const cheiaOras = id => "program:" + id;
const numeEtapa = id => (ETAPE.find(e => e.id === id) || {}).nume || id;

/* aceeași normalizare ca în index.html — păstrăm toate câmpurile */
const normDate = d => ({prefs:(d&&d.prefs)||{}, note:(d&&d.note)||{},
                        musai:(d&&d.musai)||{}, coment:(d&&d.coment)||{}});
function desfaData(x){
  if(!x || typeof x !== "object") return x;
  if(x.date && typeof x.date === "object" && !x.prefs && !x.note && !x.coment && !x.musai) return x.date;
  return x;
}

const C = {toti:{}, stare:"incarc", me:""};
try{ C.me = localStorage.getItem("jp:nume") || ""; }catch(e){}

function status(t, ms=2600){
  const e = el("status"); if(!e) return;
  e.textContent = t; e.classList.add("on");
  clearTimeout(status._t); status._t = setTimeout(() => e.classList.remove("on"), ms);
}

function citesteDeLaSheet(){
  return new Promise(res => {
    if(!URL_SCRIPT) return res(null);
    const cb = "cb" + Date.now() + Math.floor(Math.random()*1000);
    const sc = document.createElement("script");
    window[cb] = d => { res(d); delete window[cb]; sc.remove(); };
    sc.src = URL_SCRIPT + "?callback=" + cb;
    sc.onerror = () => { res(null); sc.remove(); };
    document.head.appendChild(sc);
    setTimeout(() => { if(window[cb]){ res(null); delete window[cb]; } }, 8000);
  });
}

async function incarcaComentarii(){
  const d = await citesteDeLaSheet();
  if(d){ C.toti = {}; for(const k in d) C.toti[k] = desfaData(d[k]); C.stare = "gata"; }
  else C.stare = "eroare";
  reimprospateaza();
}

/* toate comentariile unui oraș, de la toți, în ordinea scrierii */
function comentariile(orasId){
  const cheie = cheiaOras(orasId), out = [], vazut = new Set();
  for(const nume in C.toti){
    const lista = (C.toti[nume] && C.toti[nume].coment && C.toti[nume].coment[cheie]) || [];
    lista.forEach(c => { if(c && !vazut.has(c.id)){ vazut.add(c.id);
      out.push({nume, id:c.id, text:c.text, t:c.t||0}); } });
  }
  return out.sort((a,b) => a.t - b.t);
}

/* SCRIERE: citim întâi întreaga fișă a persoanei din foaie și abia apoi o
   retrimitem cu modificarea aplicată. Altfel am șterge notele și preferințele
   date în index.html, care stau în aceeași înregistrare. Dacă citirea eșuează,
   nu scriem nimic — mai bine un comentariu nesalvat decât date pierdute. */
async function scrieComentarii(schimba){
  if(!C.me) return false;
  if(!URL_SCRIPT){ status("Foaia Google nu e configurată — comentariul nu se poate salva.", 6000); return false; }
  status("Se salvează…", 9000);
  const d = await citesteDeLaSheet();
  if(!d){ status("Nu mă pot conecta la Google Sheets — comentariul nu s-a salvat. Încearcă din nou.", 9000); return false; }

  C.toti = {}; for(const k in d) C.toti[k] = desfaData(d[k]);
  C.stare = "gata";
  /* dacă persoana există deja în foaie, refolosim numele de acolo, ca să nu
     apară „Ana” și „ana” ca doi oameni */
  let cheia = C.me;
  for(const k in C.toti){ if(cheieNume(k) === cheieNume(C.me)){ cheia = k; break; } }

  const ale = normDate(C.toti[cheia]);
  schimba(ale);
  C.toti[cheia] = ale;

  try{
    await fetch(URL_SCRIPT, {method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({nume:cheia, date:ale})});
  }catch(e){ status("Fără internet — comentariul nu s-a salvat.", 9000); return false; }
  status("Salvat ✓");
  return true;
}

function unComentariu(c){
  const alMeu = C.me && cheieNume(c.nume) === cheieNume(C.me);
  const data = c.t ? new Date(c.t).toLocaleDateString("ro-RO", {day:"numeric", month:"short"}) : "";
  return `<div class="cmt ${alMeu?"al-meu":""}">
    <div class="cmt-cap"><span class="cmt-nume">${esc(c.nume)}</span>${data?`<span class="cmt-data">${data}</span>`:""}</div>
    <div class="cmt-text" data-ct="${c.id}">${esc(c.text)}</div>
    ${alMeu?`<div class="cmt-act">
      <button type="button" class="linkbtn" data-edit="${c.id}">editează</button>
      <button type="button" class="linkbtn del" data-del="${c.id}">șterge</button></div>`:""}
  </div>`;
}

function corpComentarii(orasId){
  let lista;
  if(C.stare === "incarc") lista = `<p class="cmt-gol">Se încarcă comentariile…</p>`;
  else if(C.stare === "eroare") lista = `<p class="cmt-gol">Comentariile nu se pot încărca acum.</p>`;
  else {
    const l = comentariile(orasId);
    lista = l.length
      ? `<div class="cmt-fir">${l.map(unComentariu).join("")}</div>`
      : `<p class="cmt-gol">Niciun comentariu deocamdată.</p>`;
  }
  return lista + `<div class="cmt-nou">
    <textarea id="cmt-in" rows="3" placeholder="Scrie un comentariu despre programul din ${esc(numeEtapa(orasId))}…"></textarea>
    <div class="cmt-rand">
      <button type="button" class="btn primary" id="cmt-add">Adaugă comentariu</button>
      ${C.me?`<span class="cmt-eu">semnat ca <b>${esc(C.me)}</b> ·
        <button type="button" class="linkbtn" id="cmt-alt">schimbă</button></span>`:""}
    </div></div>`;
}

function sectiuneaComentarii(orasId){
  return `<section class="comente" id="comente" data-oras="${orasId}">
    <h2>Comentarii · ${esc(numeEtapa(orasId))}</h2>
    <p class="intro">Spune-ne ce crezi despre programul de aici. Comentariile sunt vizibile pentru tot grupul.</p>
    <div id="cmt-corp">${corpComentarii(orasId)}</div>
  </section>`;
}

function reimprospateaza(){
  const sec = el("comente"); if(!sec) return;
  const orasId = sec.dataset.oras;
  el("cmt-corp").innerHTML = corpComentarii(orasId);
  legComentarii(orasId);
}

function legComentarii(orasId){
  const sec = el("comente"); if(!sec) return;
  const cheie = cheiaOras(orasId);

  const add = el("cmt-add");
  if(add) add.onclick = () => {
    const inp = el("cmt-in"), t = inp.value.trim();
    if(!t){ inp.focus(); return; }
    cuNume(async () => {
      const ok = await scrieComentarii(ale => {
        if(!ale.coment[cheie]) ale.coment[cheie] = [];
        ale.coment[cheie].push({id:"c"+Date.now()+Math.random().toString(36).slice(2,6), text:t, t:Date.now()});
      });
      if(ok) reimprospateaza();
    });
  };

  const alt = el("cmt-alt");
  if(alt) alt.onclick = () => cerNume(reimprospateaza, true);

  sec.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const id = b.dataset.del;
    const ok = await scrieComentarii(ale => {
      ale.coment[cheie] = (ale.coment[cheie]||[]).filter(c => c.id !== id);
    });
    if(ok) reimprospateaza();
  });

  sec.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    const id = b.dataset.edit;
    const box = sec.querySelector(`.cmt-text[data-ct="${id}"]`);
    const vechi = comentariile(orasId).find(c => c.id === id);
    if(!box || !vechi) return;
    box.innerHTML = `<textarea class="cmt-edit" rows="3"></textarea>
      <div class="cmt-rand"><button type="button" class="btn primary sm" data-save="1">Salvează</button>
      <button type="button" class="btn sm" data-cancel="1">Renunță</button></div>`;
    box.querySelector("textarea").value = vechi.text;
    box.querySelector("[data-save]").onclick = async () => {
      const nou = box.querySelector(".cmt-edit").value.trim();
      if(nou && nou !== vechi.text){
        const ok = await scrieComentarii(ale => {
          const c = (ale.coment[cheie]||[]).find(x => x.id === id);
          if(c) c.text = nou;
        });
        if(!ok) return;
      }
      reimprospateaza();
    };
    box.querySelector("[data-cancel]").onclick = reimprospateaza;
  });
}

/* ============ cartonașul, deschis peste program ============
   Datele stau în index.html și rămân acolo: le citim de-acolo o singură dată,
   la prima apăsare, ca să nu ținem o a doua copie a lor aici. */
let CARDURI = null, cardurileSeIncarca = null;

function incarcaCardurile(){
  if(CARDURI) return Promise.resolve(CARDURI);
  if(cardurileSeIncarca) return cardurileSeIncarca;
  cardurileSeIncarca = fetch("index.html")
    .then(r => r.ok ? r.text() : Promise.reject(new Error("index.html: " + r.status)))
    .then(t => {
      const m = t.match(/let CARDURI\s*=\s*(\[[\s\S]*?\n\];)/);
      if(!m) throw new Error("nu găsesc lista de cartonașe");
      CARDURI = new Function("return " + m[1].replace(/;\s*$/, ""))();
      return CARDURI;
    });
  return cardurileSeIncarca;
}

/* „Excursii” apare peste tot sub numele lui lung */
const numeOras = o => o === "Excursii" ? "Alte excursii posibile" : o;

function cartonasHTML(c){
  const poza = c.img
    ? `<div class="poza" style="background-image:url('${esc(c.img)}')"></div>`
    : `<div class="poza gol">${esc(c.emoji||"\u{1F341}")}</div>`;
  return `${poza}
    <div class="corp">
      <div class="kicker"><span class="dot"></span>${esc(numeOras(c.oras))}${c.tag?" · "+esc(c.tag):""}${c.timp?" · "+esc(c.timp):""}</div>
      <h3>${esc(c.titlu)}</h3>
      <p class="desc">${esc(c.desc)}</p>
      ${c.dece?`<p class="why"><b>De ce merită</b>${esc(c.dece)}</p>`:""}
      <div class="subsol"><a href="index.html#${esc(c.id)}">Deschide în pagina de experiențe, ca să o notezi →</a></div>
    </div>`;
}

function deschideCartonas(id){
  /* Dacă lista e deja în memorie — și de obicei e, fiindcă o aducem din timp —
     construim cartonașul întreg din prima, ca să nu existe o clipă în care
     fereastra e mică și goală și apoi sare la dimensiunea finală. */
  const gata = CARDURI ? CARDURI.find(x => x.id === id) : null;

  const fund = document.createElement("div");
  fund.className = "cart-fund";
  fund.innerHTML = `<div class="cart" role="dialog" aria-modal="true" aria-label="Detalii experiență">
      <button type="button" class="cart-x" aria-label="Închide">×</button>
      <div class="cart-continut">${gata ? cartonasHTML(gata) : `<p class="astept">Se încarcă…</p>`}</div>
    </div>`;
  document.body.appendChild(fund);

  const inapoi = document.activeElement;
  function inchide(){
    fund.remove();
    document.removeEventListener("keydown", peTasta);
    if(inapoi && inapoi.focus) inapoi.focus({preventScroll:true});
  }
  function peTasta(e){ if(e.key === "Escape") inchide(); }
  document.addEventListener("keydown", peTasta);
  fund.addEventListener("click", e => { if(e.target === fund) inchide(); });
  fund.querySelector(".cart-x").onclick = inchide;
  setTimeout(() => fund.querySelector(".cart-x").focus({preventScroll:true}), 40);

  /* Fundalul nu se derulează cât e fereastra deschisă, dar pagina de dedesubt
     nu se atinge deloc: oprim doar rotița și degetul peste văl. Orice i-am fi
     făcut lui body (position:fixed sau overflow:hidden) i-ar fi schimbat
     lățimea când dispare bara de derulare, iar tot textul din spate s-ar fi
     re-așezat pentru o clipă — exact „fulgerul” de dinainte. */
  const opreste = e => { if(!e.target.closest(".cart")) e.preventDefault(); };
  fund.addEventListener("wheel", opreste, {passive:false});
  fund.addEventListener("touchmove", opreste, {passive:false});

  if(gata) return true;

  incarcaCardurile().then(lista => {
    if(!fund.isConnected) return;
    const c = lista.find(x => x.id === id);
    fund.querySelector(".cart-continut").innerHTML = c
      ? cartonasHTML(c)
      : `<p class="astept">Nu găsesc acest cartonaș.</p>`;
  }).catch(() => {
    /* dacă nu putem citi lista, lăsăm legătura să-și facă treaba ca înainte */
    inchide();
    location.href = "index.html#" + id;
  });
  return true;
}


/* Legăturile rămân legături adevărate: merg în filă nouă, se pot copia și
   funcționează și fără JavaScript. Doar clicul simplu îl prindem noi. */
document.addEventListener("click", e => {
  const a = e.target.closest('.fisa .leg a[href*="index.html#"]');
  if(!a) return;
  if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
  e.preventDefault();
  deschideCartonas(a.getAttribute("href").split("#")[1]);
});

/* prenumele — ținut minte pe dispozitiv, ca să nu-l retastezi la fiecare vizită */
function cerNume(dupa, schimba){
  const f = document.createElement("div");
  f.className = "modal-fund";
  f.innerHTML = `<div class="modal">
    <h3>${schimba?"Schimbă numele":"Cum te cheamă?"}</h3>
    <p>Numele apare lângă comentariul tău, ca să știm cine ce a scris.</p>
    <input id="nm" placeholder="ex. Ana" autocomplete="given-name">
    <div class="cmt-rand"><button type="button" class="btn primary" id="go">Continuă</button>
      <button type="button" class="linkbtn" id="renunt">Mai târziu</button></div>
  </div>`;
  document.body.appendChild(f);
  const inp = f.querySelector("#nm");
  inp.value = C.me;
  const peTasta = e => { if(e.key === "Escape") inchide(); };
  function inchide(){ f.remove(); document.removeEventListener("keydown", peTasta); }
  document.addEventListener("keydown", peTasta);
  f.querySelector("#renunt").onclick = inchide;
  f.onclick = e => { if(e.target === f) inchide(); };
  f.querySelector("#go").onclick = () => {
    const v = inp.value.trim(); if(!v){ inp.focus(); return; }
    C.me = v;
    try{ localStorage.setItem("jp:nume", v); }catch(e){}
    inchide();
    if(dupa) dupa();
  };
  inp.onkeydown = e => { if(e.key === "Enter") f.querySelector("#go").click(); };
  setTimeout(() => inp.focus(), 60);
}
function cuNume(actiune){ C.me ? actiune() : cerNume(actiune); }

      <span><span class="et">Ziua anterioară</span><b></b></span></button>
    <button type="button" class="nav-zi next" id="ziNext" hidden>
      <span><span class="et">Ziua următoare</span><b></b></span>
      <span class="sag" aria-hidden="true">›</span></button>`;

  const prima = ziDeschisa && zile.some(z => z.id === ziDeschisa) ? ziDeschisa : zile[0].id;
  arataZi(prima, false);
  legComentarii(etId);
  el("zilenav").addEventListener("click", e=>{
    const b = e.target.closest("button[data-zi]");
    if(b) arataZi(b.dataset.zi);
  });
  el("ziPrev").onclick = ()=>sariZi(-1);
  el("ziNext").onclick = ()=>sariZi(+1);
}

/* Trece la ziua vecină. Când ieșim din etapă — de pildă de la 3 noiembrie,
   ultima zi de Tokyo — sărim în etapa următoare și deschidem prima ei zi,
   ca butonul să ducă mai departe în călătorie, nu într-un capăt de drum. */
function sariZi(pas){
  const zile = zileleEtapei();
  const i = zile.findIndex(z => z.id === ziCurenta);
  const urm = zile[i + pas];
  if(urm){ arataZi(urm.id); return; }

  const e = ETAPE.findIndex(x => x.id === etapaCurenta);
  const etUrm = ETAPE[e + pas];
  if(!etUrm) return;
  const zileUrm = ZILE[etUrm.id] || [];
  if(!zileUrm.length) return;
  const tinta = pas > 0 ? zileUrm[0].id : zileUrm[zileUrm.length - 1].id;
  document.querySelectorAll("#etape .etapa").forEach(x =>
    x.classList.toggle("on", x.dataset.et === etUrm.id));
  randeazaEtapa(etUrm.id, tinta);
  window.scrollTo({top:0, behavior:"smooth"});
}

let ziCurenta = null;

/* ce scrie pe săgeată: ziua vecină din etapă sau, la capăt, prima zi a etapei următoare */
function vecina(pas){
  const zile = zileleEtapei();
  const i = zile.findIndex(z => z.id === ziCurenta);
  if(zile[i + pas]) return {zi:zile[i + pas]};
  const e = ETAPE.findIndex(x => x.id === etapaCurenta);
  const etUrm = ETAPE[e + pas];
  if(!etUrm) return null;
  const zileUrm = ZILE[etUrm.id] || [];
  if(!zileUrm.length) return null;
  return {zi: pas > 0 ? zileUrm[0] : zileUrm[zileUrm.length - 1], et: etUrm};
}

/* Derulează la începutul zilei alese.
   NU folosim offsetTop-ul barei de zile: fiind position:sticky, cât timp e lipită
   de marginea de sus offsetTop-ul ei e chiar poziția curentă de derulare, deci
   „scroll” acolo însemna să rămânem exact unde eram. Ne ancorăm de blocul zilei,
   care nu e sticky, și lăsăm loc cât ține bara. */
function laInceputulZilei(id){
  const zi = el("zi-"+id), nav = el("zilenav");
  if(!zi || !nav) return;
  const sus = zi.getBoundingClientRect().top + window.scrollY - nav.offsetHeight - 8;
  const tinta = Math.max(0, sus);
  /* dacă suntem deja deasupra începutului zilei, nu împingem pagina în jos */
  if(window.scrollY > tinta) window.scrollTo({top:tinta, behavior:"smooth"});
}

function arataZi(id, deruleaza=true){
  ziCurenta = id;
  const zile = zileleEtapei();
  zile.forEach(z => { const e = el("zi-"+z.id); if(e) e.hidden = (z.id !== id); });
  document.querySelectorAll("#zilenav button").forEach(b => b.classList.toggle("on", b.dataset.zi === id));

  [["ziPrev", vecina(-1)], ["ziNext", vecina(+1)]].forEach(([bid, v])=>{
    const b = el(bid); if(!b) return;
    b.hidden = !v;
    if(v){
      b.querySelector("b").textContent = v.zi.scurt;
      b.querySelector(".et").textContent = v.et
        ? v.et.nume : (bid === "ziPrev" ? "Ziua anterioară" : "Ziua următoare");
      b.title = v.et
        ? "Mergi la " + v.et.nume + ", " + v.zi.scurt
        : "Programul zilei de " + v.zi.scurt;
    }
  });

  if(deruleaza) laInceputulZilei(id);
}

el("etape").innerHTML = ETAPE.map((e,i)=>`
  <button type="button" class="etapa${i===0?" on":""}" data-et="${e.id}" style="--ac:${e.ac}">
    <span class="e-jp">${e.jp}</span>
    <span class="e-t"><span class="e-n">${e.nume}</span><span class="e-m">${e.meta}</span></span>
  </button>`).join("");

el("etape").addEventListener("click", e=>{
  const b = e.target.closest("button[data-et]");
  if(!b) return;
  document.querySelectorAll("#etape .etapa").forEach(x=>x.classList.toggle("on", x===b));
  randeazaEtapa(b.dataset.et);
  window.scrollTo({top:0, behavior:"smooth"});
});

randeazaEtapa(ETAPE[0].id);
incarcaComentarii();
/* lista de cartonașe se aduce când browserul n-are altceva de făcut, ca și
   prima apăsare pe o experiență să deschidă fereastra instantaneu */
if("requestIdleCallback" in window) requestIdleCallback(() => incarcaCardurile().catch(()=>{}));
else setTimeout(() => incarcaCardurile().catch(()=>{}), 1500);
</script>
