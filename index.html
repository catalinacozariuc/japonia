<!DOCTYPE html>
<meta charset="utf-8">
<title>日本の秋 · Jurnal de călătorie</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --hartie:#F5EFE4; --hartie2:#FFFCF6; --tus:#33302B; --gri:#8A8377;
    --artar:#C4452D; --kaki:#B07C2A; --ceai:#6E7A52; --indigo:#4A6274;
    --linie:#E2D8C6; --linie2:#EFE7D9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--hartie)}
  #app{color:var(--tus);font-family:"Helvetica Neue",Inter,system-ui,sans-serif;min-height:100vh;
       padding:26px 18px 90px;
       background-image:radial-gradient(circle at 90% 0%,rgba(196,69,45,.07),transparent 45%),
                        radial-gradient(circle at 5% 12%,rgba(110,122,82,.07),transparent 40%),
                        radial-gradient(circle at 40% 100%,rgba(176,124,42,.05),transparent 50%)}
  .wrap{max-width:1100px;margin:0 auto}

  .kanji{font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;font-size:clamp(30px,6vw,46px);
         color:var(--artar);letter-spacing:.08em;margin:0;line-height:1.1}
  .kanji small{font-size:.42em;letter-spacing:.04em}
  h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(15px,2.4vw,19px);letter-spacing:.2em;
     text-transform:uppercase;margin:8px 0 2px;color:var(--tus)}
  h2{font-family:Georgia,serif;font-weight:400;font-size:21px;margin:0 0 10px}
  .sub{color:var(--gri);font-size:12.5px;letter-spacing:.05em;margin:0 0 22px}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

  button{font:inherit;font-size:13px;letter-spacing:.04em;cursor:pointer;background:var(--hartie2);
    color:var(--tus);border:1px solid var(--linie);border-radius:2px;padding:9px 14px;
    transition:background .15s,border-color .15s,transform .15s,color .15s}
  button:hover{border-color:var(--artar)}
  button:focus-visible{outline:2px solid var(--kaki);outline-offset:2px}
  button.primary{background:var(--artar);border-color:var(--artar);color:#fff}
  button.primary:hover{background:#a83722}
  button.on{background:var(--tus);color:var(--hartie);border-color:var(--tus)}
  button[disabled]{opacity:.4;cursor:default}
  input,textarea,select{font:inherit;font-size:14px;background:var(--hartie2);color:var(--tus);
    border:1px solid var(--linie);border-radius:2px;padding:9px 11px;width:100%}
  textarea{min-height:64px;line-height:1.45;resize:vertical}
  label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gri);margin:12px 0 5px}

  .tabs{display:flex;gap:22px;border-bottom:1px solid var(--linie);margin-bottom:20px;flex-wrap:wrap}
  .tab{padding:0 0 10px;border:0;border-bottom:2px solid transparent;border-radius:0;letter-spacing:.13em;
       text-transform:uppercase;font-size:10.5px;color:var(--gri);background:none}
  .tab:hover{background:none;color:var(--tus)}
  .tab.active{color:var(--artar);border-bottom-color:var(--artar)}

  .panel{background:var(--hartie2);border:1px solid var(--linie);border-radius:3px;padding:18px;margin-bottom:14px}
  .note{font-size:12.5px;color:var(--gri);line-height:1.65}
  .frunze{list-style:none;margin:6px 0 4px;padding:0;display:flex;flex-direction:column;gap:9px}
  .frunze li{position:relative;padding-left:26px;font-size:14px;line-height:1.5;color:var(--tus)}
  .frunze li::before{content:"🍁";position:absolute;left:0;top:1px;font-size:13px;opacity:.85}

  /* ---------- pagina de deschidere (atmosferă „Toamna în Japonia”) ---------- */
  .hero{position:relative;overflow:hidden;border-radius:4px;border:1px solid var(--linie);
    background:
      radial-gradient(120% 90% at 85% -10%,rgba(196,69,45,.14),transparent 55%),
      radial-gradient(120% 90% at -10% 20%,rgba(176,124,42,.13),transparent 55%),
      radial-gradient(140% 120% at 50% 120%,rgba(110,122,82,.12),transparent 55%),
      linear-gradient(180deg,var(--hartie2),#FBF6EC);
    padding:40px 30px 34px;margin-bottom:16px}
  .hero .jpbig{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(15px,3vw,20px);
    letter-spacing:.3em;color:var(--artar);opacity:.8;margin:0 0 14px}
  .hero h2{font-family:Georgia,serif;font-weight:400;font-size:clamp(26px,5vw,38px);line-height:1.2;
    margin:0 0 16px;color:var(--tus);max-width:16ch}
  .hero .lede{font-size:15px;line-height:1.72;color:#5C5346;max-width:52ch;margin:0 0 8px}
  .hero .lede .accent{color:var(--artar)}
  .hero .haiku{font-family:Georgia,serif;font-style:italic;font-size:15px;line-height:1.7;color:var(--kaki);
    border-left:2px solid rgba(176,124,42,.4);padding-left:16px;margin:20px 0 4px;max-width:44ch}
  .hero .meta-trip{display:flex;flex-wrap:wrap;gap:8px 10px;margin:22px 0 4px}
  .hero .chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#5C5346;
    background:rgba(255,255,255,.55);border:1px solid var(--linie);border-radius:99px;padding:6px 13px}
  .hero .chip b{font-weight:600;color:var(--tus)}
  /* frunze care cad, discret */
  .leaves{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .leaves span{position:absolute;top:-8%;font-size:18px;opacity:0;animation:cadere linear infinite;
    will-change:transform,opacity}
  @keyframes cadere{
    0%{opacity:0;transform:translateY(-10%) translateX(0) rotate(0deg)}
    10%{opacity:.75}
    90%{opacity:.6}
    100%{opacity:0;transform:translateY(720%) translateX(40px) rotate(320deg)}
  }
  .hero>*{position:relative;z-index:1}

  /* „ce urmează” — pași atmosferici */
  .pasi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 2px}
  .pas{border:1px solid var(--linie);border-radius:3px;padding:12px 14px;background:var(--hartie2)}
  .pas .p-jp{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:var(--artar);font-size:15px;opacity:.7}
  .pas b{display:block;font-family:Georgia,serif;font-weight:400;font-size:15px;margin:3px 0 2px;color:var(--tus)}
  .pas span{font-size:12px;color:var(--gri);line-height:1.5}
  .intra{max-width:560px}
  @media(prefers-reduced-motion:reduce){.leaves{display:none}}
  .meta{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gri);margin-bottom:8px}
  .hr{height:1px;background:var(--linie);margin:16px 0}

  /* ---------- notare (1-5) ---------- */
  .pref{border-bottom:1px solid var(--linie);padding:14px 2px}
  .pref:last-child{border-bottom:0}
  .pref .q{font-size:15px;line-height:1.45;margin-bottom:9px}
  .stars{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
  .st{width:34px;height:36px;border:0;background:none;padding:0;font-size:26px;line-height:1;color:#DCD2C0}
  .st:hover{background:none;border:0;transform:translateY(-2px)}
  .st.fill{color:var(--artar)}
  .scoretag{font-size:12px;color:var(--gri);margin-left:8px}

  /* animație: la notare, cardul se estompează și se deplasează vizibil în față */
  @keyframes cardFadeMove{
    0%{opacity:1;transform:translateY(0) scale(1)}
    45%{opacity:.15;transform:translateY(-10px) scale(1.05)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }
  .card.reasezat{animation:cardFadeMove .55s ease}
  /* cardul „sosit” la noua poziție — scurtă evidențiere ca să se vadă unde a ajuns */
  @keyframes cardSosit{
    0%{opacity:.15;transform:translateY(8px) scale(.97)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }
  .card.sosit{animation:cardSosit .5s ease}

  /* ---------- carduri ---------- */
  .duel{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grila{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{background:var(--hartie2);color:var(--tus);border-radius:3px;text-align:left;padding:0;
    border:1px solid var(--linie);position:relative;display:flex;flex-direction:column;width:100%;
    box-shadow:0 8px 22px rgba(80,60,40,.09);transition:transform .18s,box-shadow .18s,border-color .18s}
  .card>.thumb{border-radius:2px 2px 0 0;overflow:hidden}
  .card.pick{cursor:pointer}
  .card.pick:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(80,60,40,.16);border-color:var(--artar)}
  .card.static{box-shadow:0 4px 14px rgba(80,60,40,.07)}

  .thumb{position:relative;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;
         background-size:cover;background-position:center;overflow:hidden}
  .thumb.foto{filter:saturate(.82) contrast(1.05) sepia(.14)}
  .thumb.foto::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to top,rgba(58,38,22,.42),rgba(58,38,22,.04) 55%);}
  .thumb.gol{background:
      radial-gradient(circle at 50% 118%,var(--acs),transparent 62%),
      repeating-linear-gradient(45deg,rgba(51,48,43,.045) 0 1px,transparent 1px 11px),
      repeating-linear-gradient(-45deg,rgba(51,48,43,.045) 0 1px,transparent 1px 11px),
      linear-gradient(160deg,#F4EBDB,#E7DAC4)}
  .thumb.gol::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(60,35,20,.06)}
  .thumb .ic{font-size:44px;line-height:1;opacity:.92;filter:saturate(.92)}
  .thumb .jp{position:absolute;right:10px;bottom:6px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:30px;color:var(--ac);opacity:.14;letter-spacing:.05em}

  .card .body{padding:15px 17px 18px;display:flex;flex-direction:column;gap:7px;flex:1}
  .card h3{margin:0;font-family:Georgia,serif;font-weight:400;font-size:19px;line-height:1.28}
  .kicker{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:9.5px;letter-spacing:.15em;
    text-transform:uppercase;color:var(--gri)}
  .kicker .dot{width:5px;height:5px;border-radius:50%;background:var(--ac);opacity:.8}
  .desc{font-size:13.5px;line-height:1.58;margin:0;color:#4A453C}
  .why{font-size:12.5px;line-height:1.55;color:#6B6558;border-left:2px solid var(--ac);padding-left:10px;margin:2px 0 0}
  .why b{display:block;font:400 9.5px/1.6 inherit;letter-spacing:.15em;text-transform:uppercase;color:var(--gri)}

  .stamp{position:absolute;top:10px;right:10px;width:56px;height:56px;border:2.5px solid var(--artar);
    border-radius:50%;color:var(--artar);font-family:Georgia,serif;font-size:13px;display:flex;align-items:center;
    justify-content:center;transform:rotate(-14deg) scale(0);opacity:0;background:rgba(255,255,255,.78)}
  .stamp.show{animation:stamp .45s ease-out forwards}
  @keyframes stamp{0%{transform:rotate(-40deg) scale(2);opacity:0}60%{opacity:1}100%{transform:rotate(-14deg) scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.stamp.show{animation:none;transform:rotate(-14deg) scale(1);opacity:1}
    .card.pick:hover{transform:none}.st:hover{transform:none}}
  .vs{text-align:center;font-family:Georgia,serif;letter-spacing:.26em;color:var(--gri);margin:14px 0 12px;font-size:11.5px}
  @media(max-width:680px){.duel{grid-template-columns:1fr}.thumb .ic{font-size:38px}}

  /* ---------- optiuni organizare ---------- */
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
  .opt{background:var(--hartie);border:1px solid var(--linie);border-radius:3px;padding:14px;text-align:left;display:block}
  .opt.sel{border-color:var(--artar);background:rgba(196,69,45,.08)}
  .opt b{display:block;font-family:Georgia,serif;font-weight:400;font-size:16px;margin-bottom:5px}
  .opt span{display:block;font-size:12.5px;line-height:1.5;color:#5F594D}
  .opt em{display:block;font-style:normal;font-size:11.5px;margin-top:6px;color:var(--kaki);line-height:1.45}

  /* ---------- rezultate ---------- */
  .rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--linie)}
  .rank:last-child{border-bottom:0}
  .num{font-family:Georgia,serif;font-size:20px;color:var(--kaki);min-width:34px}
  .bar{height:5px;background:#EAE1D2;border-radius:3px;overflow:hidden;margin-top:5px}
  .bar i{display:block;height:100%;background:var(--artar)}
  .small{font-size:11.5px;color:var(--gri)}
  .pill{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--linie);
        border-radius:99px;padding:3px 9px;margin:0 6px 6px 0;color:#5F594D}
  .ed{border:1px dashed var(--linie);border-radius:3px;padding:14px;margin-bottom:10px;background:var(--hartie2)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:640px){.two{grid-template-columns:1fr}}
  .status{position:fixed;left:0;right:0;bottom:0;background:var(--tus);color:var(--hartie);
    font-size:12px;padding:8px 16px;text-align:center;transform:translateY(100%);transition:transform .25s}
  .status.on{transform:none}

  /* ---------- sectiuni pe categorii + nota pe card ---------- */
  .catsec{margin:28px 0 4px}
  .cathead{font-family:Georgia,serif;font-weight:400;font-size:19px;margin:0 0 3px;color:var(--tus);
    display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--linie);padding-bottom:7px}
  .cathead .n{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--gri)}
  .catdesc{font-size:12.5px;color:var(--gri);line-height:1.55;margin:9px 0 14px;max-width:660px}
  .cardnote{border-top:1px solid var(--linie);padding:12px 17px 15px;display:flex;flex-direction:column;gap:4px;
    background:rgba(196,69,45,.02)}
  .cardnote .ql{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--gri)}
  .callout{border-left:3px solid var(--artar);background:rgba(196,69,45,.05);padding:12px 15px;border-radius:2px;
    font-size:13.5px;line-height:1.55;margin-top:10px}

  /* ---------- propunere itinerariu ---------- */
  .trip{display:flex;flex-direction:column;gap:0}
  .leg{display:grid;grid-template-columns:60px 1fr;gap:16px;position:relative;padding:0 0 6px}
  .leg .rail{display:flex;flex-direction:column;align-items:center}
  .leg .knob{width:14px;height:14px;border-radius:50%;background:var(--ac,--artar);margin-top:6px;flex:none;
    box-shadow:0 0 0 4px var(--hartie2),0 0 0 5px var(--linie)}
  .leg .line{width:2px;flex:1;background:var(--linie);margin-top:4px}
  .leg:last-child .line{display:none}
  .leg .content{padding:0 0 20px}
  .leg .nights{font-family:Georgia,serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gri)}
  .leg h3{margin:2px 0 3px;font-family:Georgia,serif;font-weight:400;font-size:21px}
  .leg .dates{font-size:12px;color:var(--kaki);letter-spacing:.03em;margin-bottom:6px}
  .leg .placeholder{font-size:12.5px;color:var(--gri);line-height:1.55;border:1px dashed var(--linie);
    border-radius:3px;padding:11px 13px;background:var(--hartie2)}
  .hubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin-top:10px}
  .hub{border:1px solid var(--linie);border-radius:3px;padding:10px 12px;background:var(--hartie2)}
  .hub b{display:block;font-family:Georgia,serif;font-weight:400;font-size:14px;margin-bottom:2px}
  .hub span{font-size:11px;color:var(--gri)}

  /* ---------- japoneza pe scurt ---------- */
  .frazcat{margin:22px 0 12px}
  .frazcat h3{margin:0 0 3px;font-family:Georgia,serif;font-weight:400;font-size:20px}
  .frazcat h3 .jpsmall{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:var(--artar);margin-left:8px;font-size:16px}
  .frazcat p.intro{margin:0;font-size:13px;color:var(--gri);line-height:1.5}
  .frazgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px}
  .fraz{border:1px solid var(--linie);border-left:3px solid var(--ac,var(--artar));border-radius:3px;
    padding:11px 14px;background:var(--hartie2)}
  .fraz .jp{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:19px;line-height:1.25;color:var(--tus)}
  .fraz .ro{font-size:13.5px;color:var(--tus);margin-top:3px;line-height:1.4}
  .fraz .romaji{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--kaki);margin-top:5px;font-weight:600}

  /* ---------- comentarii per oraș ---------- */
  .comente{margin-top:22px}
  .cmt-fir{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
  .cmt{border:1px solid var(--linie);border-left:3px solid var(--linie);border-radius:3px;padding:10px 13px;background:var(--hartie2)}
  .cmt.al-meu{border-left-color:var(--artar);background:rgba(196,69,45,.03)}
  .cmt-cap{display:flex;align-items:baseline;gap:9px;margin-bottom:3px}
  .cmt-nume{font-family:Georgia,serif;font-size:14px;color:var(--tus)}
  .cmt-data{font-size:11px;color:var(--gri)}
  .cmt-text{font-size:14px;line-height:1.5;color:var(--tus);white-space:pre-wrap}
  .cmt-act{margin-top:6px;display:flex;gap:12px}
  .linkbtn{background:none;border:0;padding:0;font-size:12px;color:var(--kaki);cursor:pointer;text-decoration:underline}
  .linkbtn.del{color:var(--artar)}
  .linkbtn:hover{opacity:.75}
  .cmt-nou textarea,.cmt-edit{width:100%;border:1px solid var(--linie);border-radius:3px;padding:9px 11px;
    font-family:inherit;font-size:14px;color:var(--tus);background:var(--hartie);resize:vertical;line-height:1.5}
  .cmt-nou textarea:focus,.cmt-edit:focus{outline:none;border-color:var(--artar)}
  button.sm{padding:5px 12px;font-size:12px}
</style>
<div id="app"><div class="wrap" id="root"></div></div>
<div class="status" id="status"></div>
<script>
/* ============================================================================
   ① LEGĂTURA CU GOOGLE SHEETS
   Lipește aici linkul aplicației web din Apps Script (vezi GHID.md).
   Dacă îl lași gol, aplicația merge în continuare, dar răspunsurile rămân
   doar pe telefonul fiecăruia.
   ========================================================================== */
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbza_AKsZh8KuIF5DYiwB9jdQfaA_4Et7o1gs-32oMwc0jKhYxEGOVe5zxyazxE4DmQBSg/exec";

/* ============================================================================
   ② ZONA DE EDITAT — CONȚINUTUL TĂU
   ========================================================================== */

/* câte un „fișier” per oraș, în ordinea firească a călătoriei */
const ORASE = ["Tokyo","Hakone","Kyoto","Nara","Osaka","Excursii de o zi"];

/* culoare + kanji decorativ pentru fiecare oraș */
const ORAS_STIL = {
  "Tokyo":            {ac:"#C4452D", acs:"rgba(196,69,45,.14)",  jp:"東京"},
  "Hakone":           {ac:"#4A6274", acs:"rgba(74,98,116,.15)",  jp:"箱根"},
  "Kyoto":            {ac:"#6E7A52", acs:"rgba(110,122,82,.15)", jp:"京都"},
  "Nara":             {ac:"#8A6D3B", acs:"rgba(138,109,59,.15)", jp:"奈良"},
  "Osaka":            {ac:"#B07C2A", acs:"rgba(176,124,42,.15)", jp:"大阪"},
  "Excursii de o zi": {ac:"#9A5A44", acs:"rgba(154,90,68,.15)",  jp:"遠足"}
};

/* CATEGORII — se afișează în această ordine în fiecare fișier (fără butoane) */
const CATEGORII = [
  {id:"atractie",   nume:"Atracții turistice",
   desc:"Marile obiective — situri din patrimoniul UNESCO și locurile cu cele mai multe recenzii pe Google Maps. Frumoase și memorabile, dar acolo se adună cei mai mulți oameni."},
  {id:"activitate", nume:"Activități",
   desc:"Experiențe de scurtă durată — ateliere, tururi, dar și concerte, teatru și seri cu program fix. De regulă cu bilet sau programare făcută din timp."},
  {id:"culinar",    nume:"Experiențe gastronomice",
   desc:"Piețe, street food și mese-eveniment — acolo unde mâncarea în sine e scopul."},
  {id:"zona",       nume:"Zone & plimbări",
   desc:"Cartiere, grădini și plimbări — locuri unde doar hoinărim, savurăm momentul și ne odihnim lejer. Nu sunt destinații în sine, ci mai degrabă atmosferă."}
];

/* PREFERINȚE GENERALE (notă 1–10) — ordonate logic: ce vizităm · ce mâncăm · ritm & logistică */
let PREFERINTE = [
  /* — ce vizităm & ce facem — */
  {id:"p1",  text:"Cât de mult vrei să vedem temple și sanctuare?"},
  {id:"p13", text:"Cât de mult te atrag experiențele tradiționale japoneze (ritualul ceaiului, probarea kimonoului, ore de caligrafie)?"},
  {id:"p10", text:"Cât de mult te atrag muzeele de istorie și artă japoneză?"},
  {id:"p2",  text:"Cât de mult vrei să ieșim în natură — munte, pădure, parcuri?"},

  desc:"O vale încă activă, plină de fumarole și abur de sulf, la care se ajunge cu telecabina. Aici se vând faimoasele ouă negre, fierte în apa termală până li se înnegrește coaja.",

 {id:"h_jinja",oras:"Hakone",cat:"atractie",alegere:"da",titlu:"Hakone Jinja — poarta torii pe lac",emoji:"⛩️",img:"",tag:"Sanctuar",timp:"1 oră",
  desc:"O poartă roșie ridicată chiar în apa lacului Ashi, cu o pădure de cedri în spate și trepte care urcă spre sanctuarul propriu-zis.",
  dece:"E una dintre cele mai fotogenice imagini din Japonia și e goală dimineața devreme. Peste zi se face coadă pentru poza din fața porții."},
 {id:"h_amazake",oras:"Hakone",cat:"atractie",alegere:"da",titlu:"Amazake Chaya",emoji:"🍵",img:"",tag:"Ceainărie istorică",timp:"30–45 min",
  desc:"Ceainărie cu acoperiș de stuf, veche de aproape 400 de ani, pe vechiul drum Tokaido, unde se servește amazake — o băutură caldă, dulce, din orez fermentat, fără alcool.",
  dece:"E o oprire caldă și autentică, exact ca pe vremea drumeților de altădată. E doar o pauză scurtă pe traseu, nu o destinație în sine."},
 {id:"h_pola",oras:"Hakone",cat:"atractie",alegere:"poate",titlu:"Muzeul Pola",emoji:"🖼️",img:"",tag:"Muzeu",timp:"2 ore",
  desc:"Colecție de impresioniști și artă modernă, adăpostită într-o clădire elegantă îngropată aproape complet în pădure, ca să nu strice peisajul.",
  dece:"E o oră liniștită la interior, bună pe vreme rea și pentru un ritm relaxat. E puțin izolat față de restul obiectivelor."},
 {id:"h_okada",oras:"Hakone",cat:"atractie",alegere:"poate",titlu:"Muzeul Okada",emoji:"🏛️",img:"",tag:"Muzeu",timp:"1–2 ore",
  desc:"Muzeu de artă est-asiatică, cu o baie termală pentru picioare la care te poți așeza privind grădina.",
  dece:"E o combinație plăcută de artă și relaxare, mai puțin cunoscută și deci mai liniștită. Tocmai fiindcă e mai discret, poate rămâne opțional."},
 {id:"h_ashi",oras:"Hakone",cat:"atractie",alegere:"poate",titlu:"Lacul Ashi & croaziera „pirat”",emoji:"⛴️",img:"",tag:"Pe apă",timp:"1–2 ore",
  desc:"Lacul vulcanic din inima zonei, străbătut de un vaporaș în formă de corabie de pirați, cu poarta torii roșie și, pe vreme senină, Fuji în fundal.",
  dece:"E o traversare relaxantă, cu multe momente de stat jos și priveliști frumoase. Fuji se ascunde pe vreme rea — priveliștea-vedetă depinde de noroc."},

 /* -- Activități -- */
 {id:"h_onsen",oras:"Hakone",cat:"activitate",alegere:"da",titlu:"Onsen la ryokan (baie privată)",emoji:"♨️",img:"",tag:"Relaxare",timp:"1 oră",
  desc:"Baie termală tradițională la pensiunea unde stăm, ideal rezervată privat (kashikiri), ca să intre grupul împreună, în tihnă. Onsen-ul e o baie geotermală bogată în minerale, inima oricărei șederi în Hakone.",
  dece:"E relaxarea pură pe care a cerut-o grupul și punctul forte al întregii escale. De știut: multe onsen interzic tatuajele și unele au doar băi comune, pe sexe — de aceea alegem varianta privată."},
 {id:"h_kaiseki_ryokan",oras:"Hakone",cat:"activitate",alegere:"da",titlu:"Cină kaiseki la ryokan",emoji:"🍽️",img:"",tag:"Masă-eveniment",timp:"o seară",
  desc:"Masa serii la pensiune: un meniu kaiseki de sezon, cu multe feluri mici și frumos aranjate, servit de obicei la o oră fixă, inclus în cazare.",
  dece:"E un eveniment în sine, nu doar o cină — punctul culminant al zilei la ryokan. Se servește devreme și la oră fixă, deci ne organizăm ziua în jurul ei."},
 {id:"h_loop",oras:"Hakone",cat:"activitate",alegere:"poate",titlu:"Bucla „Hakone Loop”",emoji:"🚡",img:"",tag:"Traseu",timp:"o zi",
  desc:"Un tur al zonei făcut din mijloace de transport diferite, cu un singur bilet: trenuleț în serpentine, funicular, telecabină peste vale și vapor în formă de corabie pe lacul Ashi.",
  dece:"E ziua în care transportul e chiar atracția, cu multe momente de stat jos. Are însă multe schimbări și poate obosi — de dozat."},
 {id:"h_tokaido",oras:"Hakone",cat:"activitate",alegere:"poate",titlu:"Plimbare pe vechiul drum Tokaido",emoji:"🥾",img:"",tag:"Natură",timp:"1–2 ore",
  desc:"O porțiune din vechiul drum care lega Tokyo de Kyoto, pavată cu piatră și mărginită de cedri seculari, exact cum o străbăteau călătorii de acum câteva secole.",
  dece:"E o plimbare liniștită prin istorie și pădure. Pavajul e neregulat — de purtat încălțăminte bună și de mers cu grijă."},

 /* -- Experiențe culinare -- */
 {id:"h_kurotamago",oras:"Hakone",cat:"culinar",alegere:"da",titlu:"Ouă negre (kuro-tamago)",emoji:"🥚",img:"",tag:"Gustare",timp:"15 min",
  desc:"Ouă fierte în apa sulfuroasă din Owakudani, până când coaja se înnegrește complet. Legenda spune că fiecare ou mâncat aici adaugă șapte ani de viață.",
  dece:""},
 {id:"h_icecream",oras:"Hakone",cat:"culinar",alegere:"da",titlu:"Înghețată neagră de Owakudani",emoji:"🍦",img:"",tag:"Desert",timp:"15 min",
  desc:"Varianta dulce a faimoaselor ouă negre: o înghețată de culoare neagră, vândută tot în valea vulcanică, în asortiment cu tema locului.",
  dece:""},
 {id:"h_soba",oras:"Hakone",cat:"culinar",alegere:"da",titlu:"Soba de munte",emoji:"🍜",img:"",tag:"Mâncare",timp:"1 oră",
  desc:"Tăiței de hrișcă făcuți local, serviți simplu, calzi sau reci, în micile localuri din jurul lacului.",
  dece:""},

 /* =====================================================================
    KYOTO
    ===================================================================== */
 /* -- Zone & plimbări -- */
 {id:"k_sannenzaka",oras:"Kyoto",cat:"zona",alegere:"da",titlu:"Sannenzaka & Ninenzaka",emoji:"🏮",img:"",tag:"Ulițe istorice",timp:"1–2 ore",
  desc:"Cele mai frumoase ulițe pietruite din Kyoto, care urcă spre templul Kiyomizu, mărginite de case de lemn, ceainării și prăvălii vechi de generații.",
  dece:"E cartea poștală vie a Kyoto-ului tradițional, de străbătut la pas. Are trepte și se aglomerează repede — mai bine dimineața devreme."},
 {id:"k_pontocho",oras:"Kyoto",cat:"zona",alegere:"da",titlu:"Pontocho & malul râului Kamo",emoji:"🏮",img:"",tag:"Seara",timp:"1–2 ore",
  desc:"O alee îngustă și atmosferică, plină de restaurante cu felinare, lipită de râul Kamo, unde localnicii se așază pe mal la asfințit.",
  dece:"E cea mai frumoasă plimbare de seară din Kyoto și nu cere energie după o zi plină. Seara se aglomerează, iar localurile de pe alee sunt mici, cu rezervare."},
 {id:"k_arashiyama_calm",oras:"Kyoto",cat:"zona",alegere:"da",titlu:"Arashiyama liniștit — Okochi Sanso & Gio-ji",emoji:"🍃",img:"",tag:"Grădini calme",timp:"jumătate de zi",
  desc:"Partea tăcută a Arashiyamei, dincolo de aglomerația din crângul de bambus: vila și grădina Okochi Sanso, cu vedere peste oraș, și micul templu de mușchi Gio-ji.",
  dece:"E Arashiyama fără mulțime, exact colțul pe care majoritatea îl ratează. Are urcușuri ușoare — dar nimic dificil."},
 {id:"k_gion",oras:"Kyoto",cat:"zona",alegere:"poate",titlu:"Gion & Hanamikoji la lăsarea serii",emoji:"🎎",img:"",tag:"Cartier",timp:"2 ore",
  desc:"Cartierul istoric al ceainăriilor: străzi de lemn cu fațade închise, felinare care se aprind la asfințit și, cu noroc, o maiko grăbindu-se spre o programare.",
  dece:"E gratis, e superb și merge perfect după o zi plină. Pe aleile private fotografiatul e interzis prin lege, iar femeile în kimono de pe stradă sunt aproape mereu turiste."},
 {id:"k_philosopher",oras:"Kyoto",cat:"zona",alegere:"poate",titlu:"Drumul Filosofului",emoji:"🍁",img:"",tag:"Plimbare",timp:"1–2 ore",
  desc:"Doi kilometri de alee pe malul unui canal, între temple, numită după profesorul care se plimba pe ea zilnic. Toamna, culoarea vine din arțarii din curțile templelor.",
  dece:"E o plimbare plată și liniștită, în ritmul propriu, cu opriri de cafea. E lungă — o facem pe cât vrem, nu neapărat toată."},
 {id:"k_kurama",oras:"Kyoto",cat:"zona",alegere:"poate",titlu:"Kurama & Kibune",emoji:"🥾",img:"",tag:"Natură",timp:"jumătate de zi",
  desc:"Un trenuleț urcă o jumătate de oră spre nord, apoi se trece muntele pe jos, pe lângă templul Kurama, coborând la sanctuarul Kibune, pe malul unui pârâu. La final, un onsen public.",
  dece:"Ne scoate complet din cozile de la temple și arată un Kyoto pe care aproape nimeni nu-l vede. Cere însă trepte multe și încălțăminte serioasă."},

 /* -- Atracții principale -- */
 {id:"k_kiyomizu",oras:"Kyoto",cat:"atractie",alegere:"da",titlu:"Kiyomizu-dera în zori",emoji:"⛩️",img:"",tag:"Templu",timp:"1–2 ore, dimineața",
  desc:"Templu cu o terasă uriașă de lemn suspendată peste dealul împădurit, sprijinită pe stâlpi înalți, fără niciun cui. Se deschide la 6 dimineața.",
  dece:"La deschidere e aproape gol și priveliștea peste oraș e magică; după ora 9 devine un fluviu de oameni. Are urcuș și trepte — de aceea merită efortul dimineața."},
 {id:"k_fushimi",oras:"Kyoto",cat:"atractie",alegere:"da",titlu:"Fushimi Inari în zori",emoji:"🦊",img:"",tag:"Sanctuar",timp:"2–3 ore, dimineața",
  desc:"Sanctuarul cu peste zece mii de porți vermilion donate de companii, care urcă în serpentine pe munte. Bucla completă cere două-trei ore.",
  dece:"E deschis non-stop și gratis, iar la șapte dimineața tunelul de porți e aproape gol și chiar dă fiori. La zece e coadă la fiecare fotografie — diferența e enormă."},
 {id:"k_arashiyama",oras:"Kyoto",cat:"atractie",alegere:"da",titlu:"Arashiyama — bambus & Tenryu-ji",emoji:"🎋",img:"",tag:"Natură",timp:"jumătate de zi",
  desc:"Crângul de bambus prin care lumina cade filtrată și marea grădină zen Tenryu-ji, cu iazul ei oglindă și munții din spate integrați în peisaj.",
  dece:"E una dintre imaginile-simbol ale Japoniei. Crângul se traversează în zece minute și e mereu plin — venim devreme, iar grădina o luăm pe îndelete."},
 {id:"k_kinkakuji",oras:"Kyoto",cat:"atractie",alegere:"poate",titlu:"Kinkaku-ji — Pavilionul de Aur",emoji:"🪙",img:"",tag:"Templu",timp:"1 oră",
  desc:"Pavilion cu două etaje acoperite integral cu foiță de aur, ridicat în 1397 și reflectat perfect în iazul din față.",
  dece:"E Japonia de pe carte poștală, se vede în patruzeci de minute. Traseul e cu sens unic și mereu aglomerat: te uiți, fotografiezi, pleci."},
 {id:"k_ginkakuji",oras:"Kyoto",cat:"atractie",alegere:"poate",titlu:"Ginkaku-ji — Pavilionul de Argint",emoji:"🌗",img:"",tag:"Templu",timp:"1 oră",
  desc:"Contrapunctul discret al celui de aur: fără argint, dar cu o grădină zen rafinată, un con de nisip greblat și o potecă prin mușchi și arțari.",
  dece:"E mai liniștit și mai contemplativ decât „vărul” lui auriu, și se leagă frumos de Drumul Filosofului. Are un urcuș ușor."},
 {id:"k_sanjusangendo",oras:"Kyoto",cat:"atractie",alegere:"poate",titlu:"Sanjusangen-do",emoji:"🙏",img:"",tag:"Templu",timp:"1 oră",
  desc:"O sală de lemn lungă de peste o sută de metri, cu 1.001 statui aurite ale zeiței Kannon aliniate rând după rând — o priveliște care taie respirația.",
  dece:"E uimitor și complet la adăpost, bun pe orice vreme. Înăuntru nu e voie cu poze — se privește pur și simplu."},
 {id:"k_tofukuji",oras:"Kyoto",cat:"atractie",alegere:"poate",titlu:"Tofuku-ji în sezonul frunzelor",emoji:"🍂",img:"",tag:"Templu",timp:"2 ore",
  desc:"Complex zen cu un pod de lemn acoperit, suspendat peste o vale în care cresc două mii de arțari, plus o grădină de piatră modernistă cu un damier de mușchi.",
  dece:"Când culorile sunt la vârf e cea mai spectaculoasă priveliște de toamnă din Kyoto — și, exact de aceea, cea mai aglomerată. La 14 noiembrie s-ar putea să prindem doar începutul sezonului."},

 /* -- Activități -- */
 {id:"k_kaiseki",oras:"Kyoto",cat:"activitate",alegere:"da",titlu:"Cină kaiseki de top",emoji:"🍽️",img:"",tag:"Masă-eveniment",timp:"2–3 ore",
  desc:"Cea mai rafinată masă a călătoriei, la case celebre precum Kikunoi, Nakamura sau Hyotei: un meniu lung de sezon, servit într-un salon privat, ideal pentru șase.",
  dece:"E masa-eveniment perfectă pentru aniversare, vârful bucătăriei japoneze. Cere rezervare cu două-trei luni înainte și un buget pe măsură."},
 {id:"k_geiko",oras:"Kyoto",cat:"activitate",alegere:"da",titlu:"Ozashiki asobi — seară cu geiko & maiko",emoji:"🎎",img:"",tag:"Experiență rară",timp:"o seară",
  desc:"O cină privată în compania unei geiko și a unei maiko, cu jocuri tradiționale, dans și conversație — o experiență care se obține doar cu introducere, nu se cumpără liber.",
  dece:"E genul de seară care nu se poate cumpăra altfel și rămâne amintirea de neuitat a Kyoto-ului. Cere rezervare cu 3–6 luni înainte și e foarte scumpă."},
 {id:"k_ceai",oras:"Kyoto",cat:"activitate",alegere:"da",titlu:"Ceremonia privată a ceaiului",emoji:"🍵",img:"",tag:"Experiență",timp:"1–1,5 ore",
  desc:"O oră într-o casă tradițională sau într-un sub-templu, cu o gazdă care explică pas cu pas gesturile ritualului, iar la final îți bați singur matcha, cu un mic dulce alături. (Am mutat această experiență din Tokyo aici, unde e mai la locul ei.)",
  dece:"E cea mai liniștită oră a vacanței și singura care chiar explică ceva despre cultura de aici. Șase e numărul ideal pentru o sesiune privată; se stă pe pernă și se vorbește puțin."},
 {id:"k_katsura",oras:"Kyoto",cat:"activitate",alegere:"da",titlu:"Vila Imperială Katsura / Shugakuin",emoji:"🏯",img:"",tag:"Tur ghidat",timp:"1–1,5 ore",
  desc:"Vârful arhitecturii japoneze de grădină: reședințe imperiale cu pavilioane de ceai și grădini gândite ca o plimbare, vizitabile doar cu tur ghidat și în grupuri mici.",
  dece:"E o lecție rară de eleganță și proporție, departe de aglomerația obișnuită. Se rezervă din timp la Agenția Casei Imperiale — de organizat înainte de plecare."},
 {id:"k_kimono",oras:"Kyoto",cat:"activitate",alegere:"poate",titlu:"Kimono & plimbare prin Higashiyama",emoji:"👘",img:"",tag:"Experiență",timp:"jumătate de zi",
  desc:"Închiriezi un kimono complet, cu tot ce ține de el, și te plimbi îmbrăcat tradițional prin cartierul vechi, printre case de lemn și temple.",
  dece:"E memorabil și dă cele mai frumoase fotografii ale călătoriei. Kimonoul e incomod la mers îndelungat — de ținut cont pentru o zi cu multă plimbare."},
 {id:"k_hozugawa",oras:"Kyoto",cat:"activitate",alegere:"poate",titlu:"Barcă pe râul Hozugawa",emoji:"🛶",img:"",tag:"Natură",timp:"2 ore",
  desc:"O coborâre de vreo două ore pe râu, cu barcagii care mânuiesc prăjina și vâsla, printr-o vale care toamna se colorează în roșu și auriu, până în Arashiyama.",
  dece:"E o cale relaxantă și spectaculoasă de a ajunge în Arashiyama, cu peisaj de toamnă. E sezonieră și cere rezervare."},
 {id:"k_sake",oras:"Kyoto",cat:"activitate",alegere:"poate",titlu:"Degustare de sake în Fushimi",emoji:"🍶",img:"",tag:"Experiență",timp:"1–1,5 ore",
  desc:"Fushimi e cel mai vechi cartier de crame de sake din Japonia, cu apă de izvor renumită. Se poate aranja o degustare privată, cu explicații despre cum se face.",
  dece:"E o incursiune plăcută într-o tradiție locală, cu degustare pe îndelete. Presupune alcool și rezervare — de aici semnul de întrebare."},
 {id:"k_sutre",oras:"Kyoto",cat:"activitate",alegere:"poate",titlu:"Copiat sutre la Saiho-ji (Templul de Mușchi)",emoji:"✍️",img:"",tag:"Experiență",timp:"2 ore",
  desc:"Saiho-ji, cunoscut ca „templul de mușchi”, e o grădină verde de o liniște rară. Înainte de a intra, vizitatorii participă la un scurt ritual: copiază cu pensula un text budist (o sutră), în tăcere — un fel de meditație prin scris.",
  dece:"E una dintre cele mai liniștite și mai neobișnuite experiențe din Kyoto, tocmai fiindcă intrarea se merită prin acest gest. Se intră doar pe rezervare, cu număr limitat de locuri pe zi — de programat din timp."},

 /* -- Experiențe culinare -- */
 {id:"k_nishiki",oras:"Kyoto",cat:"culinar",alegere:"poate",titlu:"Piața Nishiki, de gustat pe drum",emoji:"🥢",img:"",tag:"Mâncare",timp:"1–2 ore",
  desc:"„Bucătăria orașului Kyoto”: o stradă acoperită, lungă de vreo patru sute de metri, cu peste o sută de tarabe vechi de generații — murături colorate, tofu, gogoși cu lapte de soia, orice pe băț.",
  dece:"E prânzul care e și plimbare, iar vegetarienii se descurcă aici mai bine decât oriunde în Japonia. E îngustă și se aglomerează la prânz; se mănâncă lângă tarabă, nu din mers."},
 {id:"k_kyowagyu",oras:"Kyoto",cat:"culinar",alegere:"da",titlu:"Kyo-wagyu / teppanyaki",emoji:"🥩",img:"",tag:"Masă-eveniment",timp:"2 ore",
  desc:"Vită de Kyoto gătită pe plita încinsă chiar în fața ta, de un bucătar care taie și rumenește feliile bucată cu bucată, la tejghea.",
  dece:""},
 {id:"k_kaiseki_culinar",oras:"Kyoto",cat:"culinar",alegere:"poate",titlu:"Kaiseki de sezon",emoji:"🍱",img:"",tag:"Masă-eveniment",timp:"2–3 ore",
  desc:"Bucătăria multi-fel care definește Kyoto: mâncare de sezon, gândită vizual, servită într-o succesiune calmă de farfurii mici. (E aceeași categorie ca cina kaiseki de la Activități — aici privită ca experiență gastronomică.)",
  dece:""},
 {id:"k_yudofu",oras:"Kyoto",cat:"culinar",alegere:"poate",titlu:"Yudofu — tofu fiert",emoji:"🍲",img:"",tag:"Mâncare",timp:"1–1,5 ore",
  desc:"Specialitate vegetariană a templelor: bucăți de tofu fierte blând într-un bulion ușor, servite lângă Nanzen-ji, într-un cadru tihnit.",
  dece:""},
 {id:"k_obanzai",oras:"Kyoto",cat:"culinar",alegere:"poate",titlu:"Obanzai — bucătărie casnică",emoji:"🍢",img:"",tag:"Mâncare",timp:"1,5 ore",
  desc:"Farfurii de sezon în stil de casă, servite într-un izakaya rafinat: multe feluri mici de legume, pește și tofu, de împărțit la masă.",
  dece:""},

 /* -- Spectacole -- */
 {id:"k_minamiza",oras:"Kyoto",cat:"activitate",alegere:"da",titlu:"Minamiza — teatru kabuki",emoji:"🎭",img:"",tag:"Teatru",timp:"1–4 ore",
  desc:"Cel mai vechi teatru de kabuki din Japonia, chiar în inima cartierului Gion, cu spectacole de mare fast.",
  dece:"E kabuki autentic într-un cadru istoric, central și ușor de ajuns. De verificat programul pentru intervalul nostru (marele festival kaomise e de obicei în decembrie)."},
 {id:"k_gionodori",oras:"Kyoto",cat:"activitate",alegere:"da",titlu:"Gion Odori (1–10 noiembrie)",emoji:"💃",img:"",tag:"Dans · toamna",timp:"1 oră",
  desc:"Spectacolul de dans de toamnă al cartierului Gion Higashi, susținut de geiko și maiko, care se ține doar câteva zile pe an — chiar la începutul șederii noastre.",
  dece:"E o ocazie rară de a vedea dansul tradițional pe scenă, exact în fereastra noastră de date. Biletele se pun în vânzare din septembrie — de rezervat din timp."},
 {id:"k_gioncorner",oras:"Kyoto",cat:"activitate",alegere:"da",titlu:"Gion Corner",emoji:"🎏",img:"",tag:"Spectacol",timp:"1 oră",
  desc:"Un spectacol scurt care adună într-o singură seară șapte arte tradiționale japoneze — ceai, dans, muzică, teatru de păpuși — ca o introducere accesibilă.",
  dece:"E cel mai ușor mod de a gusta mai multe arte deodată, într-o oră. E gândit pentru turiști și rămâne la suprafață — bun ca introducere, nu ca aprofundare."},

    OSAKA

 /* -- Zone & plimbări -- */
 {id:"o_dotonbori",oras:"Osaka",cat:"zona",alegere:"da",titlu:"Dotonbori seara",emoji:"🎆",img:"",tag:"Cartier",timp:"2 ore",
  desc:"Canalul din inima orașului, cu reclame de neon reflectate în apă, faimoasa firmă cu alergătorul Glico și o pădure de panouri luminoase deasupra unei străzi întregi de mâncare.",
  dece:"E cvintesența Osakăi — gălăgioasă, colorată, prietenoasă — și cea mai bună seară de grup din vacanță. E foarte aglomerată, deci o luăm ca priveliște și gustări, nu ca loc de stat pe îndelete."},
 {id:"o_shinsekai",oras:"Osaka",cat:"zona",alegere:"da",titlu:"Shinsekai & Tsutenkaku",emoji:"🎰",img:"",tag:"Cartier retro",timp:"2 ore",
  desc:"Cartier construit în 1912 după modelul Parisului și al New York-ului, apoi oprit în timp: în mijloc turnul Tsutenkaku, iar în jur saloane de pachinko, localuri de kushikatsu și o atmosferă de Japonie a anilor '60.",
  dece:"E cel mai bun loc din Osaka pentru o plimbare fără plan, cu neon kitsch și mâncare ieftină la fiecare colț. Arată mai obosit decât restul orașului — dar ăsta e chiar farmecul lui."},
 {id:"o_amerika",oras:"Osaka",cat:"zona",alegere:"poate",titlu:"Amerikamura",emoji:"🛹",img:"",tag:"Cartier tineresc",timp:"1–2 ore",
  desc:"Cartierul vintage și tineresc al Osakăi, cu magazine second-hand, street art și cafenele, un fel de răspuns local la moda de stradă.",
  dece:"E o plimbare relaxată prin partea tânără și boemă a orașului. E de nișă — interesant mai ales dacă ne place moda și atmosfera underground."},
 {id:"o_nakanoshima",oras:"Osaka",cat:"zona",alegere:"poate",titlu:"Nakanoshima",emoji:"🏛️",img:"",tag:"Plimbare",timp:"1–2 ore",
  desc:"O insulă lungă între două brațe de râu, cu muzee, arhitectură veche de cărămidă și maluri amenajate pentru plimbare.",
  dece:"E colțul liniștit și elegant al Osakăi, bun pentru un ritm lent. Are mai puține obiective „de bifat” — mai mult atmosferă."},

 /* -- Atracții principale -- */
 {id:"o_teamlab",oras:"Osaka",cat:"atractie",alegere:"da",titlu:"teamLab Botanical Garden",emoji:"💠",img:"",tag:"Artă digitală",timp:"2 ore",
  desc:"Grădina botanică a orașului transformată noaptea într-un muzeu de artă digitală: copaci, iazuri și poteci în care lumina și proiecțiile reacționează la prezența ta.",
  dece:"E o experiență spectaculoasă și complet diferită de restul zilei, perfectă seara. De știut: se ține doar după lăsarea întunericului și e în aer liber — depinde de vreme."},
 {id:"o_castel",oras:"Osaka",cat:"atractie",alegere:"poate",titlu:"Castelul Osaka & parcul",emoji:"🏯",img:"",tag:"Istorie",timp:"2–3 ore",
  desc:"Ridicat în 1583 de cel care a unificat Japonia, ars și reconstruit de mai multe ori; turnul de azi are lift și muzeu, iar în jur se întinde un parc uriaș cu ziduri ciclopice și șanț de apă.",
  dece:"Parcul e adevărata atracție — plimbare lungă și verde, plată. Interiorul e modern, mai mult muzeu; în weekend, coada la lift e serioasă."},
 {id:"o_umeda",oras:"Osaka",cat:"atractie",alegere:"poate",titlu:"Umeda Sky Building",emoji:"🌉",img:"",tag:"Panoramă",timp:"1–2 ore",
  desc:"Două turnuri unite la ultimul etaj de o „grădină plutitoare”: o terasă circulară deschisă la 173 de metri, la care se ajunge cu o scară rulantă suspendată în gol între clădiri.",
  dece:"E o panoramă superbă la apus, la jumătate din prețul turnurilor din Tokyo. Scările rulante expuse pot da vertij — cine are rău de înălțime va sări peste ele."},
 {id:"o_kaiyukan",oras:"Osaka",cat:"atractie",alegere:"poate",titlu:"Acvariul Kaiyukan",emoji:"🐋",img:"",tag:"Familie",timp:"2 ore",
  desc:"Unul dintre cele mai mari acvarii din lume, construit în jurul unui bazin central uriaș cu un rechin-balenă.",
  dece:"E o vizită plăcută, la adăpost, pe placul tuturor vârstelor. În weekend se aglomerează serios."},

 /* -- Activități -- */
 {id:"o_tombori",oras:"Osaka",cat:"activitate",alegere:"da",titlu:"Croazieră Tombori pe canal",emoji:"🚤",img:"",tag:"Pe apă",timp:"20 min",
  desc:"Un vaporaș scurt care alunecă prin canalul Dotonbori, printre neoanele reflectate în apă, cu un ghid vesel care spune poveștile locului.",
  dece:"E cel mai comod mod de a vedea Dotonbori — stai jos, cu priveliștea în jur. E scurt și turistic, dar exact de aceea ușor de strecurat în seară."},
 {id:"o_turgastro",oras:"Osaka",cat:"activitate",alegere:"da",titlu:"Tur gastronomic cu ghid",emoji:"🍶",img:"",tag:"Cu ghid",timp:"3 ore",
  desc:"O seară de degustări prin Dotonbori sau Shinsekai, cu un ghid local care ne duce din local în local și explică fiecare fel — Osaka fiind „bucătăria Japoniei”.",
  dece:"E cel mai bun mod de a mânca autentic fără stresul de a alege între zeci de localuri, ideal pentru grup. Are un cost — dar rezolvă cina și distracția deodată."},
 {id:"o_depachika",oras:"Osaka",cat:"activitate",alegere:"poate",titlu:"Depachika la Umeda",emoji:"🍰",img:"",tag:"Mâncare",timp:"1 oră",
  desc:"Subsolurile gastronomice ale marilor magazine din Umeda: hale întregi de mâncare fină și dulciuri perfecte, cu mostre gratuite la multe tarabe.",
  dece:"E un festin vizual și o cale ușoară de a strânge un picnic sau cadouri gourmet. Se aglomerează, mai ales spre închidere."},

 /* -- Experiențe culinare -- */
 {id:"o_takoyaki",oras:"Osaka",cat:"culinar",alegere:"da",titlu:"Takoyaki",emoji:"🐙",img:"",tag:"Street food",timp:"30 min",
  desc:"Bile de aluat cu bucăți de caracatiță, rumenite în forme speciale și servite fierbinți, cu sos, maioneză și fulgi de bonito — felul-simbol al Osakăi.",
  dece:""},
 {id:"o_okonomiyaki",oras:"Osaka",cat:"culinar",alegere:"da",titlu:"Okonomiyaki",emoji:"🥞",img:"",tag:"Mâncare",timp:"1,5 ore",
  desc:"O „clătită” sărată cu varză, ou și ce mai vrei, gătită pe plita încinsă din mijlocul mesei — în stil Osaka totul amestecat.",
  dece:""},
 {id:"o_kushikatsu",oras:"Osaka",cat:"culinar",alegere:"da",titlu:"Kushikatsu",emoji:"🍢",img:"",tag:"Street food",timp:"1,5 ore",
  desc:"Frigărui de carne, legume și de tot felul, trecute prin pesmet și prăjite, cu o singură regulă de fier: nu înmui frigăruia de două ori în sosul comun.",
  dece:""},
 {id:"o_kuromon",oras:"Osaka",cat:"culinar",alegere:"da",titlu:"Piața Kuromon",emoji:"🦀",img:"",tag:"Mâncare",timp:"1–2 ore",
  desc:"„Bucătăria Osakăi”: o piață acoperită unde se cumpără și se mănâncă pe loc — picioare de crab la grătar, frigărui de wagyu, stridii, fructe perfecte.",
  dece:"E prânzul în care fiecare comandă altceva și nimeni nu face compromisuri. E vizibil orientată spre turiști, deci mai scumpă — o luăm ca experiență, nu ca chilipir."},
 {id:"o_kappo",oras:"Osaka",cat:"culinar",alegere:"da",titlu:"Kappo / sushi la tejghea",emoji:"🍣",img:"",tag:"Masă-eveniment",timp:"2 ore",
  desc:"Bucătărie de tejghea intimă, în care bucătarul gătește și servește direct în fața ta, fel cu fel, într-un dialog aproape personal.",
  dece:"E o masă de mare calitate și foarte personală. Localurile au puține locuri, deci pentru șase e nevoie de rezervare din timp."},
 {id:"o_kobe",oras:"Osaka",cat:"culinar",alegere:"da",titlu:"Wagyu de Kobe la teppanyaki",emoji:"🥩",img:"",tag:"Masă-eveniment",timp:"2 ore",
  desc:"Vită premium gătită pe plită chiar în fața mesei, feliată și rumenită de bucătar bucată cu bucată, în cartierul elegant Kitashinchi.",
  dece:""},

 /* -- Spectacole -- */
 {id:"o_billboard",oras:"Osaka",cat:"activitate",alegere:"da",titlu:"Billboard Live Osaka",emoji:"🎵",img:"",tag:"Concert",timp:"o seară",
  desc:"O sală intimă de concerte cu cină la masă, în Umeda, unde vezi artiști de aproape, confortabil.",
  dece:"E o seară muzicală relaxată, cu mâncare bună și fără aglomerație. Se rezervă din timp, iar programul depinde de cine cântă în noiembrie."},
 {id:"o_shochikuza",oras:"Osaka",cat:"activitate",alegere:"poate",titlu:"Osaka Shochikuza",emoji:"🎭",img:"",tag:"Teatru",timp:"1–4 ore",
  desc:"Teatru de kabuki chiar în inima Dotonbori, unde se pot vedea spectacole clasice în plin centrul animat al orașului.",
  dece:"E kabuki central și ușor de combinat cu o seară în Dotonbori. De verificat programul pentru zilele noastre."},

 /* =====================================================================
    NARA
    ===================================================================== */
 /* -- Zone & plimbări -- */
 {id:"n_narapark",oras:"Nara",cat:"zona",alegere:"poate",titlu:"Parcul Nara",emoji:"🦌",img:"",tag:"Parc",timp:"jumătate de zi",
  desc:"Parcul central al orașului, plat și ondulat, prin care umblă libere peste o mie de căprioare și în care se înșiră, la pas, cele mai importante temple.",
  dece:"E inima vizitei la Nara, cu totul de făcut pe jos, într-un ritm lejer. Spre Todai-ji se aglomerează — restul parcului rămâne liniștit."},
 {id:"n_naramachi",oras:"Nara",cat:"zona",alegere:"poate",titlu:"Naramachi",emoji:"🏘️",img:"",tag:"Cartier vechi",timp:"1–2 ore",
  desc:"Fostul cartier negustoresc, la sud de parc: case de lemn (machiya) transformate în cafenele, ateliere și mici muzee, pe străduțe tăcute.",
  dece:"E colțul autentic și liniștit al orașului, departe de căprioare și autocare. Are puține „atracții” mari — e mai mult atmosferă și plimbare."},
 {id:"n_ukimido",oras:"Nara",cat:"zona",alegere:"poate",titlu:"Ukimido — pavilionul de pe iaz",emoji:"⛩️",img:"",tag:"Foișor pe apă",timp:"30 min",
  desc:"Un foișor de lemn cu șase laturi, ridicat chiar pe apa iazului Sarusawa, care pare că plutește și se oglindește perfect la răsărit și la apus. E una dintre cele mai liniștite și fotogenice opriri din Nara.",
  dece:"E un loc de câteva minute de tihnă și o fotografie frumoasă, mai ales pe lumină blândă. E doar o scurtă oprire, ușor de prins în drumul prin parc."},

 /* -- Atracții principale -- */
 {id:"n_todaiji",oras:"Nara",cat:"atractie",alegere:"da",titlu:"Todai-ji & Marele Buddha",emoji:"🙏",img:"",tag:"Templu",timp:"1–2 ore",
  desc:"Una dintre cele mai mari construcții de lemn din lume, adăpostind un Buddha de bronz înalt de cincisprezece metri, turnat în anul 752.",
  dece:"E monumental și te lasă fără cuvinte — obiectivul-simbol al orașului. E aglomerat; celebrul „stâlp cu gaură” prin care se trece are mereu coadă."},
 {id:"n_kofukuji",oras:"Nara",cat:"atractie",alegere:"da",titlu:"Kofuku-ji & pagoda cu cinci niveluri",emoji:"🏯",img:"",tag:"Templu",timp:"1 oră",
  desc:"Ansamblu de temple vechi chiar lângă gară, dominat de o pagodă cu cinci niveluri, printre cele mai înalte din Japonia.",
  dece:"E primul obiectiv când intri în parc, plat și ușor de vizitat. Se leagă firesc de restul plimbării prin Nara."},
 {id:"n_nigatsudo",oras:"Nara",cat:"atractie",alegere:"da",titlu:"Nigatsu-do",emoji:"🌇",img:"",tag:"Panoramă",timp:"1 oră",
  desc:"O terasă de lemn suspendată pe deal, în spatele lui Todai-ji, de unde se deschide o priveliște gratuită peste tot orașul, superbă la apus.",
  dece:"E cea mai frumoasă panoramă din Nara și, spre deosebire de multe, e gratis. Are trepte până sus — un urcuș scurt, dar real."},
 {id:"n_nandaimon",oras:"Nara",cat:"atractie",alegere:"poate",titlu:"Poarta Nandaimon & gardienii Nio",emoji:"🗿",img:"",tag:"În drum",timp:"20 min",
  desc:"Cea mai mare poartă de templu din Japonia, chiar pe drumul spre Todai-ji, străjuită de doi gardieni Nio sculptați în lemn, uriași și feroce.",
  dece:"E impresionantă și e oricum în drum spre Marele Buddha — o vezi fără efort. E o oprire scurtă, nu o destinație separată."},
 {id:"n_kasuga",oras:"Nara",cat:"atractie",alegere:"poate",titlu:"Kasuga Taisha",emoji:"🏮",img:"",tag:"Sanctuar",timp:"1 oră",
  desc:"Sanctuar ascuns într-o pădure de cedri, la capătul unei alei mărginite de mii de felinare — de piatră pe alee, de bronz sub streșinile clădirilor vermilion.",
  dece:"E mistic și scapă de aglomerație, cu lumina de după-amiază printre cedri. Felinarele se aprind doar de câteva ori pe an, la festival — în rest, se privesc stinse."},
 {id:"n_naramuseum",oras:"Nara",cat:"atractie",alegere:"poate",titlu:"Muzeul Național Nara",emoji:"🖼️",img:"",tag:"Muzeu",timp:"1–1,5 ore",
  desc:"Un muzeu mic și bine ținut, dedicat sculpturii și artei budiste, chiar în parc.",
  dece:"E o oprire la adăpost, bună pe vreme rea sau pentru o pauză de la mers. Biletele se opresc devreme, pe la 16:30 — de prins din timp."},

 /* -- Activități -- */
 {id:"n_deer",oras:"Nara",cat:"activitate",alegere:"da",titlu:"Hrănitul căprioarelor",emoji:"🦌",img:"",tag:"Experiență",timp:"1 oră",
  desc:"Căprioarele din Nara umblă libere prin parc și au învățat să se încline pentru un biscuit special (shika senbei), vândut la tarabe peste tot.",
  dece:"E cea mai multă bucurie pe minut din toată Japonia și place absolut tuturor. Sunt animale sălbatice, nu de grădină zoologică: împing și trag de haine când văd biscuiți."},
 {id:"n_ghid",oras:"Nara",cat:"activitate",alegere:"da",titlu:"Nara cu ghid privat de la 07:30",emoji:"🧭",img:"",tag:"Cu ghid",timp:"jumătate de zi",
  desc:"Un tur ghidat care începe pe la 7:30, ca să ajungem la Todai-ji înainte de autocare, cât parcul e încă gol.",
  dece:"E cu totul altă experiență să vezi Marele Buddha în liniște, aproape singuri. Cere ghid rezervat cu 1–2 luni înainte și o trezire foarte matinală."},
 {id:"n_narahotel",oras:"Nara",cat:"activitate",alegere:"da",titlu:"Prânz la Nara Hotel",emoji:"🍽️",img:"",tag:"Masă",timp:"1,5 ore",
  desc:"Un prânz elegant în salonul unui hotel istoric de lângă parc, cu atmosferă de epocă și confort.",
  dece:"E o pauză rafinată și odihnitoare în mijlocul unei zile pe picioare. Cere rezervare și are un preț pe măsura cadrului."},

 /* -- Experiențe culinare -- */
 {id:"n_mochi",oras:"Nara",cat:"culinar",alegere:"da",titlu:"Mochi pisat la Nakatanidou",emoji:"🍡",img:"",tag:"Show & gustare",timp:"20 min",
  desc:"La Nakatanidou, pe strada Sanjo, doi bărbați pisează mochi-ul cu ciocane de lemn la o viteză amețitoare, într-un mic spectacol de stradă, iar la final îl vinzi cald, cu pastă de fasole dulce.",
  dece:"E și show, și gustare caldă delicioasă — două lucruri deodată, ieftin. E foarte scurt și adesea cu coadă, dar merită oprirea."},
 {id:"n_kakinoha",oras:"Nara",cat:"culinar",alegere:"poate",titlu:"Kakinoha-zushi",emoji:"🍣",img:"",tag:"Mâncare",timp:"30 min",
  desc:"Sushi presat, învelit în frunză de curmal japonez, care îl păstrează proaspăt — o specialitate locală de altădată, portabilă.",
  dece:""},
 {id:"n_somen",oras:"Nara",cat:"culinar",alegere:"poate",titlu:"Miwa somen",emoji:"🍜",img:"",tag:"Mâncare",timp:"1 oră",
  desc:"Tăiței foarte subțiri de grâu, cu origini chiar în regiunea Nara, serviți simplu, calzi sau reci.",
  dece:""},
 {id:"n_narazuke",oras:"Nara",cat:"culinar",alegere:"poate",titlu:"Narazuke",emoji:"🥒",img:"",tag:"De degustat",timp:"15 min",
  desc:"Legume conservate îndelung în drojdie de sake, o specialitate veche din Nara, cu gust intens și dulce-alcoolizat.",
  dece:""},

 /* -- Din Kansai (Kyoto / Osaka) -- */
 {id:"x_himeji",oras:"Excursii de o zi",cat:"atractie",alegere:"da",titlu:"Himeji & grădina Koko-en",emoji:"🏯",img:"",tag:"Din Kansai · 1h",timp:"o zi",
  desc:"Cel mai frumos castel autentic al Japoniei, alb ca un stârc și niciodată distrus, la o oră cu shinkansen; alături, grădina Koko-en, cu nouă grădini clasice diferite.",
  dece:"E castelul-etalon al țării, se combină ușor cu Kobe și se ajunge repede. Are multe trepte abrupte în interior — de urcat cu răbdare."},
 {id:"x_miyama",oras:"Excursii de o zi",cat:"zona",alegere:"da",titlu:"Miyama — sat cu acoperișuri de stuf",emoji:"🏡",img:"",tag:"Din Kansai · cu van",timp:"o zi",
  desc:"Un sat de munte cu case tradiționale kayabuki (acoperișuri groase de stuf), păstrat aproape neschimbat, într-o vale liniștită.",
  dece:"E Japonia rurală autentică, departe de orice mulțime. Se ajunge doar cu van sau ghid și e mai departe — o zi întreagă dedicată."},
 {id:"x_biwa",oras:"Excursii de o zi",cat:"atractie",alegere:"da",titlu:"Lacul Biwa",emoji:"🌊",img:"",tag:"Din Kansai · 45 min",timp:"o zi",
  desc:"Cel mai mare lac al Japoniei, cu poarta torii Shirahige ridicată în apă, o alee spectaculoasă de metasequoia și castelul autentic Hikone pe mal.",
  dece:"E o combinație rară de peisaj și un castel original, la mică distanță de Kyoto. Punctele sunt răspândite, deci merge cel mai bine cu van."},
 {id:"x_hiroshima",oras:"Excursii de o zi",cat:"atractie",alegere:"da",titlu:"Hiroshima & Miyajima",emoji:"⛩️",img:"",tag:"Din Kansai · 2h",timp:"o zi lungă / cu înnoptare",
  desc:"Memorialul Păcii, cu cupola rămasă sub epicentru și muzeul care documentează 6 august 1945, și, în golf, insula Miyajima cu poarta torii care pare că plutește pe apă.",
  dece:"E una dintre cele mai puternice și mai importante zile ale călătoriei. E departe pentru o singură zi — de preferat cu o înnoptare, ca să prindem și Miyajima la apus."},
 {id:"x_uji",oras:"Excursii de o zi",cat:"zona",alegere:"poate",titlu:"Uji",emoji:"🍵",img:"",tag:"Din Kansai · 20 min",timp:"jumătate de zi",
  desc:"La douăzeci de minute de Kyoto: capitala ceaiului matcha și templul Byodo-in, cel de pe moneda de 10 yeni, reflectat într-un iaz.",
  dece:"E aproape, relaxat și parfumat a ceai proaspăt. E mic — se face lejer într-o jumătate de zi, eventual lipit de altceva."},
 {id:"x_kobe",oras:"Excursii de o zi",cat:"zona",alegere:"poate",titlu:"Kobe",emoji:"🥩",img:"",tag:"Din Kansai · 30 min",timp:"jumătate de zi",
  desc:"Oraș-port elegant, cu faimosul wagyu de Kobe, cartierul de vile occidentale Kitano și o priveliște frumoasă spre golf.",
  dece:"E gastronomic și plăcut, ușor de combinat cu Himeji. Are mai puține „atracții” clasice — mai mult atmosferă și o masă bună."},
 {id:"x_miho",oras:"Excursii de o zi",cat:"atractie",alegere:"poate",titlu:"Muzeul Miho",emoji:"🏛️",img:"",tag:"Din Kansai · 1h cu van",timp:"jumătate de zi",
  desc:"Un muzeu proiectat de I.M. Pei, la care se ajunge printr-un tunel argintiu prin munte și un pod suspendat, cu o colecție de artă antică într-un cadru spectaculos.",
  dece:"E arhitectură remarcabilă și aproape gol, o oază liniștită. E departe și are program sezonier — de verificat că e deschis în noiembrie."},
 {id:"x_koya",oras:"Excursii de o zi",cat:"atractie",alegere:"poate",titlu:"Koyasan — cu înnoptare la templu",emoji:"🏔️",img:"",tag:"Din Kansai · 2h",timp:"2 zile",
  desc:"Așezare monastică budistă la 800 de metri, unde dormi într-un templu, pe futon, cu cină vegetariană de călugări, participi dimineața la ritualul focului și treci prin Okunoin, cimitirul cu peste două sute de mii de morminte sub cedri uriași.",
  dece:"Nu e o excursie de o zi, ci o noapte — și e, de departe, una dintre cele mai puternice amintiri de dus acasă. Cere un drum lung, cină devreme și camere fără lux."},

 /* -- Din Tokyo -- */
 {id:"x_kamakura",oras:"Excursii de o zi",cat:"zona",alegere:"da",titlu:"Kamakura",emoji:"🌊",img:"",tag:"Din Tokyo · 1h",timp:"o zi",
  desc:"„Kyoto de est”, la o oră de Tokyo: un Buddha de bronz de treisprezece metri care stă sub cerul liber din 1252, temple zen pe dealuri împădurite și un tramvai de coastă care merge lipit de case până la mare.",
  dece:"E cea mai bună zi lentă de lângă Tokyo, cu ocean la final și nimic obligatoriu. Weekendul aglomerează tramvaiul serios — mai bine într-o zi lucrătoare."},
 {id:"x_fuji",oras:"Excursii de o zi",cat:"atractie",alegere:"da",titlu:"Muntele Fuji / Kawaguchiko",emoji:"🗻",img:"",tag:"Din Tokyo · 2h",timp:"o zi",
  desc:"Lacul Kawaguchiko, cu una dintre cele mai frumoase vederi spre Fuji, și pagoda Chureito de pe deal, imaginea clasică a muntelui cu pagoda în prim-plan.",

/* note = notă 1–5 pe fiecare card · coment = comentarii per oraș {oras:[{id,text,t}]} */

function status(t,ms=2200){const el=$("#status");el.textContent=t;el.classList.add("on");
  clearTimeout(status._t);status._t=setTimeout(()=>el.classList.remove("on"),ms);}

/* ---------- salvare / citire ---------- */
function citesteDeLaSheet(){
  return new Promise(res=>{
    if(!URL_SCRIPT) return res(null);
    const cb="cb"+Date.now();
    window[cb]=d=>{res(d);delete window[cb];sc.remove()};
    const sc=document.createElement("script");
    sc.src=URL_SCRIPT+"?callback="+cb;
    sc.onerror=()=>{res(null);sc.remove()};
    document.head.appendChild(sc);
    setTimeout(()=>{if(window[cb]){res(null);delete window[cb]}},8000);
  });
}
async function salveaza(){
  S.toti[S.me]=S.date;
  if(URL_SCRIPT){
    try{
      await fetch(URL_SCRIPT,{method:"POST",mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({nume:S.me,date:S.date})});
      status("Salvat ✓");
    }catch(e){status("Nu am reușit să salvez — verifică internetul")}
  }else if(ARTIFACT){
    try{await window.storage.set("jp:r:"+cheieNume(S.me),JSON.stringify({nume:S.me,date:S.date}),true)}catch(e){}
  }
  try{localStorage.setItem("jp:"+cheieNume(S.me),JSON.stringify(S.date))}catch(e){}
}
async function load(){
  const d=await citesteDeLaSheet();
  if(d) S.toti=d;
  else if(ARTIFACT){
    try{const l=await window.storage.list("jp:r:",true);
      for(const k of (l?.keys||[])){const v=await window.storage.get(k,true);
        const obj=JSON.parse(v.value);
        const nume=(obj&&obj.nume)||k.replace("jp:r:","");
        S.toti[nume]=(obj&&obj.date)||obj;}}catch(e){}
  }
  /* completează cu ce e salvat local (utilizatori de pe același dispozitiv) */
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
    if(k&&k.startsWith("jp:")&&!k.startsWith("jp:r:")){const nume=k.slice(3);
      if(!S.toti[nume]){try{S.toti[nume]=JSON.parse(localStorage.getItem(k));}catch(e){}}}}}catch(e){}
  S.loading=false;render();
}

const card=id=>CARDURI.find(c=>c.id===id);
const esc=s=>(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const stil=o=>ORAS_STIL[o]||ORAS_STIL["Tokyo"];

/* nume case-insensitive: „CATALINA” și „catalina” = aceeași persoană.
   cheieNume = forma canonică (litere mici) pentru chei de stocare;
   rezolvaNume = dacă există deja un utilizator cu același nume (indiferent de majuscule),
   îi refolosim numele existent, altfel păstrăm cum a fost scris acum. */
const cheieNume=n=>(n||"").trim().toLowerCase();
function rezolvaNume(v){
  const k=cheieNume(v);
  for(const nume in S.toti){ if(cheieNume(nume)===k) return nume; }
  try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);
    if(key&&key.startsWith("jp:")&&!key.startsWith("jp:r:")&&cheieNume(key.slice(3))===k) return key.slice(3);}}catch(e){}
  return v.trim();
}

}
function corpCard(c){

    `<button class="st ${i<val?"fill":""}" data-v="${i+1}" aria-label="${i+1} din ${max}">★</button>`).join("")}

/* ---------- EXPERIENȚE (notează fiecare card 1–5; reordonare live după notă) ---------- */
function cardCuNota(c){
  const val=S.date.note[c.id]||0;
  return `<article class="card static" data-cid="${c.id}">
    ${thumb(c)}${corpCard(c)}
    <div class="cardnote"><div class="ql">Cât de mult vrei să facem asta?</div>
      ${steleRand("data-note",c.id,val)}
    </div></article>`;

/* ordine în cadrul unei categorii: după nota ta (mare→mic), restul își păstrează ordinea */
function ordoneazaCat(cards){
  return cards
    .map((c,i)=>({c,i,nota:S.date.note[c.id]||0}))
    .sort((a,b)=> b.nota-a.nota || a.i-b.i)
    .map(x=>x.c);
}
function vExp(){
  const v=$("#view");
  const lista=CARDURI.filter(c=>c.oras===S.oras);
  const notate=lista.filter(c=>S.date.note[c.id]>0).length;
  let html=`<div class="panel"><h2>Notează fiecare experiență 🍁</h2>
    <p class="note">Dă fiecărei experiențe de la 1 la 5 stele. Notează-le pe toate, nu doar preferatele.</p></div>`
    + baraOrase()
    + `<p class="meta">${esc(S.oras)} · ${notate}/${lista.length} notate</p>`;
  CATEGORII.forEach(cat=>{
    const cards=ordoneazaCat(lista.filter(c=>c.cat===cat.id));
    if(!cards.length)return;
    html+=`<div class="catsec"><h3 class="cathead">${esc(cat.nume)} <span class="n">${cards.length}</span></h3></div>
      <p class="catdesc">${esc(cat.desc)}</p>
      <div class="grila">${cards.map(cardCuNota).join("")}</div>`;
  });
  if(!lista.length)html+=`<div class="panel"><p class="note">Încă n-avem cartonașe pentru ${esc(S.oras)}.</p></div>`;
  html+=boxaComentarii(S.oras);
  v.innerHTML=html;
  legOrase();
  legComentarii(S.oras);
  v.querySelectorAll(".stars").forEach(g=>g.querySelectorAll(".st").forEach(b=>b.onclick=async()=>{
    const id=g.dataset.note;
    S.date.note[id]=+b.dataset.v;
    salveaza();
    animaReasezare(id);
  }));
}
/* rulează animația de estompare + deplasare pe cardul atins, apoi rerandează (reordonând) în timp ce e estompat */
function animaReasezare(id){
  const card=document.querySelector(`.card[data-cid="${id}"]`);
  if(!card){vExp();return;}
  card.classList.add("reasezat");
  const y=window.scrollY;   // reținem poziția paginii, ca să n-o mișcăm
  // la jumătatea animației (când cardul e cel mai estompat) reconstruim lista în noua ordine…
  setTimeout(()=>{
    vExp();
    window.scrollTo(0,y);   // pagina rămâne exact unde era — doar cardurile se reașază
    // …apoi evidențiem scurt cardul mutat, ca să se vadă unde a ajuns (fără a derula pagina)
    const nou=document.querySelector(`.card[data-cid="${id}"]`);
    if(nou){ nou.classList.add("sosit");
      setTimeout(()=>nou.classList.remove("sosit"),700); }
  },250);
}

/* ---------- COMENTARII per oraș (fir de discuție, partajat între toți) ---------- */
/* strânge toate comentariile pentru un oraș, de la toți utilizatorii (din S.toti) */
function toateComentariile(oras){
  const out=[];
  const surse={...S.toti,[S.me]:S.date};   // include și ce am eu nesalvat încă
  for(const nume in surse){
    const cl=(surse[nume]&&surse[nume].coment&&surse[nume].coment[oras])||[];
    cl.forEach(c=>out.push({nume,id:c.id,text:c.text,t:c.t||0}));
  }
  return out.sort((a,b)=>a.t-b.t);
}
function boxaComentarii(oras){
  const lista=toateComentariile(oras);
  const fire=lista.map(c=>{
    const alMeu=c.nume===S.me;
    const data=c.t?new Date(c.t).toLocaleDateString("ro-RO",{day:"numeric",month:"short"}):"";
    return `<div class="cmt ${alMeu?"al-meu":""}">
      <div class="cmt-cap"><span class="cmt-nume">${esc(c.nume)}</span>${data?`<span class="cmt-data">${data}</span>`:""}</div>
      <div class="cmt-text" data-ct="${c.id}">${esc(c.text)}</div>
      ${alMeu?`<div class="cmt-act"><button class="linkbtn" data-edit="${c.id}">editează</button>
        <button class="linkbtn del" data-del="${c.id}">șterge</button></div>`:""}
    </div>`;
  }).join("");
  return `<div class="panel comente">
    <div class="meta">Comentarii · ${esc(oras)}</div>
    <p class="note" style="margin-bottom:12px">Spune-le celorlalți ce crezi — care ți-au plăcut cel mai mult, ce ai vrea neapărat, orice idee. Comentariile sunt vizibile pentru tot grupul.</p>
    <div class="cmt-fir">${fire||`<p class="note" style="opacity:.7">Încă niciun comentariu pentru ${esc(oras)}. Fii primul!</p>`}</div>
    <div class="cmt-nou">
      <textarea id="cmt-in" rows="3" placeholder="Scrie un comentariu despre ${esc(oras)}…"></textarea>
      <div class="row" style="margin-top:8px"><button class="primary" id="cmt-add">Adaugă comentariu</button></div>
    </div></div>`;
}
function legComentarii(oras){
  const wrap=$(".comente"); if(!wrap)return;
  const add=$("#cmt-add"), inp=$("#cmt-in");
  if(add) add.onclick=async()=>{
    const t=inp.value.trim(); if(!t)return;
    if(!S.date.coment[oras]) S.date.coment[oras]=[];
    S.date.coment[oras].push({id:"c"+Date.now()+Math.random().toString(36).slice(2,6),text:t,t:Date.now()});
    await salveaza(); vExp();
  };
  wrap.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.del;
    S.date.coment[oras]=(S.date.coment[oras]||[]).filter(c=>c.id!==id);
    await salveaza(); vExp();
  });
  wrap.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.edit;
    const el=wrap.querySelector(`.cmt-text[data-ct="${id}"]`);
    const vechi=(S.date.coment[oras]||[]).find(c=>c.id===id);
    if(!el||!vechi)return;
    el.innerHTML=`<textarea class="cmt-edit" rows="3">${esc(vechi.text)}</textarea>
      <div class="row" style="margin-top:6px"><button class="primary sm" data-save="${id}">Salvează</button>
      <button class="sm" data-cancel="1">Renunță</button></div>`;
    el.querySelector("[data-save]").onclick=async()=>{
      const nou=el.querySelector(".cmt-edit").value.trim();
      if(nou){vechi.text=nou;vechi.t=vechi.t||Date.now();await salveaza();}
      vExp();
    };
    el.querySelector("[data-cancel]").onclick=()=>vExp();
  });
}

/* ---------- REZULTATE ---------- */
function vRez(){
  const oameni=Object.keys(S.toti).length?Object.keys(S.toti):[S.me];
  const v=$("#view");
  const medie=arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
  const abatere=(arr,m)=>arr.length>1?Math.sqrt(arr.reduce((s,x)=>s+(x-m)**2,0)/arr.length):0;

  /* preferințe generale */
  const medii=PREFERINTE.map(p=>{
    const note=oameni.map(o=>S.toti[o]&&S.toti[o].prefs&&S.toti[o].prefs[p.id]).filter(x=>x>0);
    const m=medie(note);return{p,m,sd:abatere(note,m)};
  }).sort((a,b)=>b.m-a.m);

  /* clasament carduri pentru orașul selectat */
  const cards=CARDURI.filter(c=>c.oras===S.oras);
  const rank=cards.map(c=>{
    const note=oameni.map(o=>S.toti[o]&&S.toti[o].note&&S.toti[o].note[c.id]).filter(x=>x>0);
    const m=medie(note);return{c,m,sd:abatere(note,m),cnt:note.length};
  }).sort((a,b)=>b.m-a.m);

  v.innerHTML=`<div class="row" style="margin-bottom:12px"><button id="reload">🔄 Reîncarcă răspunsurile</button></div>`
  + baraOrase() +
  `<div class="panel"><div class="meta">Clasamentul experiențelor — ${esc(S.oras)} · după nota medie</div>
    ${rank.length?rank.map((x,i)=>`<div class="rank"><span class="num">${x.m?x.m.toFixed(1):"–"}</span>
      <div style="flex:1"><div>${String(i+1).padStart(2,"0")} · ${esc(x.c.titlu)}
        <span class="small">· ${esc((CATEGORII.find(k=>k.id===x.c.cat)||{}).nume||"")}</span></div>
      <div class="bar"><i style="width:${x.m*20}%"></i></div>
      <div class="small">${x.cnt?x.cnt+" note":"nenotat încă"}${x.sd>1.25?" · ⚡ păreri împărțite":x.sd<0.6&&x.m?" · ✓ consens":""}</div></div></div>`).join("")
      :`<p class="note">Nicio notă încă pentru ${esc(S.oras)}.</p>`}</div>
    <div class="panel"><div class="meta">Preferințe generale — media grupului (${oameni.length} persoane)</div>
    ${medii.map(x=>`<div class="rank"><span class="num">${x.m?x.m.toFixed(1):"–"}</span>
      <div style="flex:1"><div style="font-size:14px">${esc(x.p.text)}</div>
      <div class="bar"><i style="width:${x.m*10}%"></i></div></div>
      <span class="small">${x.sd>2.5?"⚡ păreri împărțite":x.sd<1.2&&x.m?"✓ consens":"~ mixt"}</span></div>`).join("")}</div>
  <div class="panel"><div class="meta">Cine a răspuns</div>
    ${oameni.map(o=>`<span class="pill">${esc(o)}</span>`).join("")}</div>`;
  legOrase();
  $("#reload").onclick=async()=>{status("Se încarcă…");const d=await citesteDeLaSheet();if(d)S.toti=d;render();};
}

load();
</script>
